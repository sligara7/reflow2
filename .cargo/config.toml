# Cap build parallelism.
#
# Why: on a 4-core / 11 GiB dev box, `cargo test --workspace` runs 4 concurrent
# rustc jobs. Together with a browser and an editor in the same systemd user
# slice that crosses systemd-oomd's 50% memory-pressure threshold, and oomd
# kills the WHOLE VTE scope — shell, agent, and MCP server die together, which
# presents as "the terminal crashed". Observed twice on 2026-07-28 (9.0G and
# 7.2G scope peaks, killing 21 and 18 processes).
#
# Two jobs roughly halves peak build memory for a modest wall-clock cost. Raise
# it if you have the headroom; `cargo build -j4` overrides per-invocation.
[build]
jobs = 2
