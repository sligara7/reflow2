# CI — the done-gates from AGENTS.md, enforced on every push instead of on
# every agent remembering. Two jobs by cost:
#
# - `core` needs no RocksDB: the core crate's fast path (in-memory backend),
#   fmt/clippy, the schema validator, the installer suite, and the skill lint.
#   Feedback in a couple of minutes.
# - `full` pays the RocksDB C++ compile once (then rust-cache carries it): the
#   whole workspace including the MCP surface, then the instruments that drive
#   the REAL binary over stdio — smoke_mcp (the only layer that catches what
#   three agreeing home-grown clients once all missed), phase_trial (13/13,
#   explicitly a regression gate), model_the_loop and coherent_erosion_trial
#   (exit non-zero on regression). erosion_trial is deliberately absent: it
#   exits non-zero BY DESIGN until the ledger-judgement decision changes.
#
# ubuntu-22.04 to match release.yml, not -latest.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core gates (no RocksDB)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # The export-lineage guard (BL-107) compares HEAD against HEAD~1, and
          # checkout defaults to depth 1 — so `git show HEAD~1:...` failed, the
          # check treated the question as unanswerable and SKIPPED, and it has
          # therefore never once run in CI. Depth 2 is exactly what it needs
          # (BL-208).
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-core
      - name: Core tests (in-memory backend)
        run: cargo test -p reflow2-core --no-default-features --no-fail-fast
      - name: Clippy (core)
        run: cargo clippy -p reflow2-core --no-default-features --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --check
      - name: Schema validates
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tools/validate_schema.py
      - name: Installer suite (hermetic)
        run: python3 tools/test_init.py
      - name: Loop-nudge hook suite (hermetic)
        run: python3 tools/test_loop_nudge.py
      - name: View-renderer suite (hermetic, file-form — no binary)
        run: python3 tools/test_render_views.py
      - name: Skill lint (skills' contract with the surface, and AGENTS.md's gate list vs this file)
        run: python3 tools/skill_lint.py
      - name: Skill-lint suite (hermetic — the gate cross-check's own net, BL-159)
        run: python3 tools/test_skill_lint.py
      - name: Wall-check suite (hermetic — the declared decomposition vs the real source)
        run: python3 tools/test_wall_check.py
      - name: Doc-version drift (prose vs what the build actually pins)
        run: python3 tools/check_doc_versions.py
      - name: Doc-version checker suite (hermetic)
        run: python3 tools/test_check_doc_versions.py

  full:
    name: workspace + real-binary instruments
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          # Same reason as the core job: the lineage guard runs in THIS job and
          # needs HEAD~1 to exist (BL-208).
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-full
      - name: Workspace tests (both crates)
        run: cargo test --workspace --no-fail-fast
      - name: Clippy (mcp)
        run: cargo clippy -p reflow2-mcp --all-targets -- -D warnings
      - name: Build the served binary
        run: cargo build -p reflow2-mcp
      - name: Design coherence gate (reflow2 on itself — self-model matches the build)
        # reflow2's own consumer CI gate (BL-66), run on reflow2's own committed
        # self-model: re-hashes registered artifacts, reconciles, detect_gaps.
        # Fails the build on unaccepted drift (a code change that didn't reconcile
        # the design) or a serious open gap. MUST live in this job, not core: it
        # spawns the reflow2-mcp binary (built just above), which the no-RocksDB
        # core job does not build — placed there it FileNotFounded on every push,
        # so the gate silently never ran in CI (found cutting v0.10.0).
        run: python3 tools/reflow2_check.py --export docs/design/reflow2.json
      - name: Coherence-gate suite (hermetic — the gate's own regression net, BL-88)
        run: python3 tools/test_reflow2_check.py
      - name: Self-host still exercises DOCUMENTS (BL-199 — the canary for BL-176)
        # Guards the RECORD, not the code. reflow2 attached 32 of its 35 document
        # artifacts with REALIZES, against its own served skill, so it never did
        # the thing that fires BL-176 and could not find that bug on itself for
        # eleven releases. This fails if the design record drifts back to
        # REALIZES-only and silently loses the ability to catch that regression.
        run: python3 tools/self_host_uses_documents.py docs/design/reflow2.json
      - name: Design intent moves only on the owner's word
        # The one ENFORCED rule this project has that actually enforces. Anthony
        # marked it gate-blocking on 2026-08-09 ("stop the build") and nothing
        # checked it for twelve days, because an honest check would have gone red
        # against 57% of the settled design on the day it landed. His answer was
        # to grandfather: guard what is settled from here, do not reopen what
        # came before. The boundary lives in the graph on
        # dec:the-authority-check-guards-forward-not-backward, not in the script,
        # so silencing a finding means editing the design where a review sees it.
        run: python3 tools/check_intent_authority.py docs/design/reflow2.json
      - name: Intent-authority suite (hermetic — it must never pass quietly)
        run: python3 tools/test_check_intent_authority.py
      - name: Command surface agrees with itself
        # reflow2's own surface lives in several places — three skill dirs, a
        # command source and its copy, and an alias table in Rust — and until
        # 2026-09-01 nothing compared them. Two had already drifted: four
        # commands existed only in this repo, and the alias table was missing
        # three of eleven, which reproduced the exact 2026-08-19 failure that
        # table was written to fix. Verified to FAIL on all three drift shapes
        # before being wired here, not merely to pass on a clean tree.
        run: python3 tools/check_command_surface.py
      - name: Merge-driver suite (real git branches, not a home-grown client)
        # Git is the client this contract is with, so git runs the test: two
        # branches editing different parts of one export must merge with no
        # human, and a both-sides conflict must leave the path unmerged.
        run: python3 tools/test_merge_driver.py
      - name: Shared-sessions suite (one server, several client sessions, one design)
        # req:sessions-share-a-graph / req:seat-per-client: the store is
        # single-writer PER PROCESS, so one server with many sessions is the
        # answer rather than a worktree each. Real HTTP, real concurrent
        # clients — the seat bug this guards would have been silent.
        run: python3 tools/test_shared_sessions.py
      - name: Nudge-path suite (the REGISTERED hook, run as registered)
        # req:nudge-path-proven: test_loop_nudge covers the script's logic given
        # its inputs, and passed the whole time nobody had checked the hook was
        # installed. This reads .claude/settings.json, runs the command it finds,
        # and asserts the JSON block decision the harness actually consumes.
        run: python3 tools/test_nudge_path.py
      - name: Stale-seat suite (two real graphs, one shared export file)
        # req:stale-seat-knows: a seat whose graph never caught up must not
        # replace the shared design with a complete-but-older document. Two
        # separate servers and a real file, because that is the shape of the bug.
        run: python3 tools/test_stale_seat.py
      - name: Degraded-server + held-graph-snapshot suite (measured against a real lock)
        # The fleet outage of 2026-07-25: a peer that cannot take the single-writer
        # lock must still handshake and say why, instead of dying before any tool
        # exists. Both sides of a REAL held lock, so it cannot pass against a mock.
        run: python3 tools/test_degraded_server.py
      - name: Smoke test over real stdio
        run: python3 tools/smoke_mcp.py
      - name: Toolsnaps — served surface matches the committed goldens (BL-76)
        run: python3 tools/toolsnap.py
      - name: Seat identity survives every transport (one client, one seat)
        run: python3 tools/stateless_seat_probe.py
      - name: Phase-coverage trial (13/13 regression gate)
        run: python3 tools/phase_trial.py
      - name: Process-model probe
        run: python3 tools/model_the_loop.py
      - name: Coherent-erosion trial
        run: python3 tools/coherent_erosion_trial.py
