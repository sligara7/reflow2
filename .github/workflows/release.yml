# Release binaries — BL-15's published-binaries half.
#
# On every version tag (or a manual dispatch naming an existing tag), build the
# reflow2-mcp binary for each supported platform and attach it to the GitHub
# release, together with the consumer kit as a tarball. This is what lets
# someone run reflow2 WITHOUT a checkout: the binary is prebuilt (no ~14-minute
# RocksDB compile), and the kit tarball carries `tools/reflow2_init.py` +
# `getting-started/` in the same sibling layout the script expects from the
# repo.
#
# Asset names are deliberately version-less (`reflow2-mcp-linux-x86_64.tar.gz`)
# so the installer can use the stable `releases/latest/download/<asset>` URL
# with no API parsing; the version lives in the release tag and in
# KIT_VERSION.json inside the kit tarball.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v0.4.0)"
        required: true

permissions:
  contents: write
  # The container job pushes to the registry attached to this repository.
  packages: write

jobs:
  binaries:
    name: binary (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, not -latest: the binary links the runner's glibc, so
          # building on the oldest supported runner keeps it runnable on more
          # machines than it was built on — never fewer.
          - name: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          # macos-x86_64 is CROSS-COMPILED on the Apple-Silicon runner rather
          # than built natively on macos-13. GitHub's macos-13 (Intel) runners
          # are chronically scarce — a queued x86_64 job stalled the v0.5.0
          # release for 11h and never cleared. Apple's clang cross-compiles
          # C++ (librocksdb-sys) to x86_64 natively, so macos-14 produces the
          # Intel binary in seconds without touching the scarce runner pool.
          - name: macos-x86_64
            runner: macos-14
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.name }}
      - name: Build
        run: cargo build --release -p reflow2-mcp --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" -czf "dist/reflow2-mcp-${{ matrix.name }}.tar.gz" reflow2-mcp
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  kit:
    name: consumer kit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Package the kit
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          COMMIT="$(git rev-parse --short HEAD)"
          COMMITTED_AT="$(git log -1 --format=%cI)"
          # The tag must name the version it ships — a v0.5.0 tag on a Cargo.toml
          # that says 0.4.0 would publish a kit that lies about its binary.
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match Cargo.toml version ${VERSION}" >&2
            exit 1
          fi
          # Same sibling layout as the repo: reflow2_init.py resolves the kit
          # as ../getting-started relative to itself, and a version stamp file
          # stands in for the git metadata a tarball does not have.
          mkdir -p kit-stage/reflow2-kit/tools
          cp tools/reflow2_init.py kit-stage/reflow2-kit/tools/
          cp tools/reflow2_install.py kit-stage/reflow2-kit/tools/
          cp tools/reflow2_check.py kit-stage/reflow2-kit/tools/
          cp tools/loop_nudge.py kit-stage/reflow2-kit/tools/
          cp -r getting-started kit-stage/reflow2-kit/
          printf '{"reflow2_version": "%s", "commit": "%s", "committed_at": "%s", "source": "release-tarball"}\n' \
            "$VERSION" "$COMMIT" "$COMMITTED_AT" > kit-stage/reflow2-kit/KIT_VERSION.json
          mkdir -p dist
          tar -C kit-stage -czf dist/reflow2-kit.tar.gz reflow2-kit
      - uses: actions/upload-artifact@v4
        with:
          name: kit
          path: dist/*
          if-no-files-found: error

  container:
    name: container image
    # binaries: this job WRAPS the already-built linux-x86_64 binary instead of
    # recompiling it — see the Dockerfile for why (a rebuild would take ~14
    # minutes on RocksDB and could ship a binary that differs from the released
    # one). kit: that job already fails the build when the tag and Cargo.toml
    # version disagree, so depending on it means this image cannot be tagged
    # with a version the release does not actually ship.
    needs: [binaries, kit]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: binary-linux-x86_64
          path: dist
      - name: Stage the binary into the build context
        run: |
          set -euo pipefail
          tar -xzf dist/reflow2-mcp-linux-x86_64.tar.gz -C .
          test -x reflow2-mcp || { echo "reflow2-mcp missing or not executable" >&2; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # ⭐ THE IMAGE MUST START BEFORE IT IS PUBLISHED, AND THAT ORDER IS THE
      # WHOLE POINT OF THIS STEP.
      #
      # v0.27.0 withdrew `--content-path` and the ENTRYPOINT went on passing it.
      # clap exits 2 on an unknown argument, so the container died before it
      # opened the graph — and FIVE releases (v0.27.0 … v0.31.0) each published
      # that image. Nothing here was negligent; "Verify the image is actually
      # pullable" below verified the wrong property, and was true the whole time.
      # A pull is not a start.
      #
      # Built with --load rather than --push so this runs on an image that is
      # still local. A smoke test after the push tells you what you shipped;
      # this one exists to stop you shipping it.
      - name: The image must start (gate — runs before anything is published)
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load --tag reflow2-mcp:candidate .
          docker/smoke.sh reflow2-mcp:candidate
      - name: Build and push
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/reflow2-mcp"
          # A consumer PINS a version. `latest` is published too, but the
          # version tag is the one flo2 and anyone else should reference —
          # chasing `latest` is how a consumer gets a surface change it never
          # agreed to (req:reflow2-consumable-as-an-image).
          docker buildx build \
            --platform linux/amd64 \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.description=reflow2 design server. NO AUTHENTICATION — deploy on a private network behind a gateway that authenticates." \
            --push .
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
      - name: Verify the image is actually pullable
        run: |
          set -euo pipefail
          # The release workflow already learned this lesson once (BL-55): a run
          # that goes green while shipping nothing is worse than a red one,
          # because nobody looks. Pushing is not evidence the manifest resolves.
          #
          # ⚠️ THIS IS A DISTRIBUTION CHECK AND NOTHING MORE. It answers "does
          # the manifest resolve", which is worth asking and is NOT worth
          # mistaking for "does the image work" — five broken releases passed
          # this step. The gate above is the one that answers that.
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" > /dev/null
          echo "published ${IMAGE}:${VERSION}"

  publish:
    name: publish release
    needs: [binaries, kit]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz > checksums.txt
          cat checksums.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Draft first, publish last: a non-draft release flips releases/latest
          # the moment it exists, so a failure mid-upload used to leave a live
          # "latest" with checksums.txt and no binaries — install.sh users got
          # 404s until someone noticed (BL-55). A draft is invisible to /latest
          # until every asset is verified present.
          created_draft=""
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$TAG" --notes "See CHANGELOG.md for what changed."
            created_draft=1
          fi
          # --clobber: a re-run replaces assets rather than failing on them.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          # Every expected asset must be attached before this goes live.
          for asset in reflow2-mcp-linux-x86_64.tar.gz reflow2-mcp-macos-arm64.tar.gz \
                       reflow2-mcp-macos-x86_64.tar.gz reflow2-kit.tar.gz checksums.txt; do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
              -q '.assets[].name' | grep -qx "$asset" \
              || { echo "missing asset after upload: $asset" >&2; exit 1; }
          done
          if [ -n "$created_draft" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
