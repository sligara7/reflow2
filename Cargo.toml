# Reflow 2.0 — Rust workspace for the deterministic core.
#
# The core is surface-agnostic and LLM-free (see docs/interaction-surfaces.md):
# it stands up the graph store + schema and the deterministic coherence-loop
# operations. Consumer surfaces (MCP/CLI/hosted) and LLM-reasoning ops plug in
# later, exactly as the predecessor `integrated_reflow` (`../ir2`) did.
#
# Foundation crates are pulled from `dynograph-foundation` by git tag. They are
# not published to crates.io. `dynograph-storage` is taken with
# default-features=false so the RocksDB C++ build (and its ~10-min compile) is
# opt-in per crate — the core runs on the in-memory backend for dev/tests.

[workspace]
resolver = "2"
members = [
    "crates/reflow2-core",
    "crates/reflow2-mcp",
]

[workspace.package]
version = "0.37.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Anthony Sligar <sligara7@gmail.com>"]
repository = "https://github.com/sligara7/reflow2"

[workspace.dependencies]
dynograph-core = { git = "https://github.com/sligara7/dynograph-foundation.git", tag = "v0.12.0" }
dynograph-storage = { git = "https://github.com/sligara7/dynograph-foundation.git", tag = "v0.12.0", default-features = false }
# Pure, dependency-free graph-theory algorithms (components, cuts, centrality,
# Leiden communities) — powers HEAL's structural detectors + the allocation analysis.
dynograph-graph = { git = "https://github.com/sligara7/dynograph-foundation.git", tag = "v0.12.0" }
# Fuzzy string matching (jaro_winkler / token_sort_ratio) for INGEST cross-id dedup.
dynograph-resolution = { git = "https://github.com/sligara7/dynograph-foundation.git", tag = "v0.12.0" }
# Pure vector + statistics math (mean, linear_regression_slope, …) for the depth
# axis: DimensionObservation rollup + per-epoch quality drift. Embeddings-optional.
dynograph-vector = { git = "https://github.com/sligara7/dynograph-foundation.git", tag = "v0.12.0" }

# For local cross-repo dev against an unreleased foundation, uncomment and point
# each crate at ../dynograph-foundation/crates/*. Do not commit uncommented.
# [patch."https://github.com/sligara7/dynograph-foundation.git"]
# dynograph-core = { path = "../dynograph-foundation/crates/dynograph-core" }
# dynograph-storage = { path = "../dynograph-foundation/crates/dynograph-storage" }
# dynograph-graph = { path = "../dynograph-foundation/crates/dynograph-graph" }
# dynograph-resolution = { path = "../dynograph-foundation/crates/dynograph-resolution" }

# ── Build-artifact size, and why this is set ────────────────────────────────
#
# Measured 2026-08-11 on the dev box: target/ had reached 288 GB and filled the
# root filesystem. It was not a leak — it is cargo's ordinary behaviour meeting
# this project's shape, and cargo never garbage-collects:
#
#   target/debug/deps   1,824 artifacts, 104 distinct names, 252 GB
#   the reflow2_mcp test binary alone      43 copies × ~313 MB
#
# Every integration test file links its own binary against RocksDB, and each
# rebuild mints a NEW hash-suffixed copy while the old ones stay forever. With
# ~50 test files and many rebuilds a day, that is several GB per working hour.
#
# `debug = "line-tables-only"` keeps what this project actually reads — panic
# backtraces with file and line, which is what every test failure is diagnosed
# from — and drops the variable/type DWARF that made each binary ~300 MB. It
# does NOT keep full local-variable inspection under a debugger; if you need
# that for a session, override it rather than removing this.
#
# This shrinks each NEW artifact. It does not collect old ones — cargo has no
# GC, so a periodic sweep of target/debug/deps (keep the newest artifact per
# name, delete the rest) is still worth running when the disk gets tight.
[profile.dev]
debug = "line-tables-only"
# Kept, but it earned far less than predicted and the numbers are recorded so
# nobody re-runs this experiment. The hypothesis was that since 88% of a test
# binary is `.debug_*`, and ~50 test binaries each embed their own copy of the
# same dependency DWARF, moving it beside the object files would be the big
# win. MEASURED, per test binary: 313 MB → 249 MB with line-tables-only alone
# → 233 MB adding this. So this line bought 6%, not a multiple.
#
# ⭐ THE REAL FIX WAS NOT A PROFILE SETTING AT ALL — it was that cargo has no
# GC. target/debug/deps held 1,824 artifacts under 104 distinct names (43
# copies of the reflow2_mcp test binary alone); sweeping the stale duplicates
# recovered 225 GiB against these settings' ~25%. Sweep first when the disk is
# tight; these settings only slow the refill.
split-debuginfo = "unpacked"

# Tests are the bulk of the artifacts, and they inherit dev rather than reading
# [profile.dev] directly — stated explicitly so the intent survives a reader who
# only greps for "test".
[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
