# Reflow 2.0 — Rust workspace for the deterministic core.
#
# The core is surface-agnostic and LLM-free (see docs/interaction-surfaces.md):
# it stands up the graph store + schema and the deterministic coherence-loop
# operations. Consumer surfaces (MCP/CLI/hosted) and LLM-reasoning ops plug in
# later, exactly as the predecessor `integrated_reflow` (`../ir2`) did.
#
# Foundation crates WERE pulled from `dynograph-foundation` by git tag, until
# 2026-08-24. NOTHING IS PULLED FROM THAT REPOSITORY ANY MORE: the subset reflow2
# actually called was absorbed into `reflow2-core/src/` under provenance headers
# (dec:absorb-the-foundation-subset-and-end-the-dependency). What survived the
# move is the shape that made the dependency bearable — the RocksDB C++ build
# (and its ~10-min compile) stays opt-in behind reflow2-core's own `rocksdb`
# feature, so the core still runs on the in-memory backend for dev/tests.

[workspace]
resolver = "2"
members = [
    "crates/reflow2-core",
    "crates/reflow2-mcp",
]

[workspace.package]
version = "0.41.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
authors = ["Anthony Sligar <sligara7@gmail.com>"]
repository = "https://github.com/sligara7/reflow2"

[workspace.dependencies]
# dynograph-core and dynograph-storage were HERE until 2026-08-24, and
# dynograph-text came with storage's `fulltext` feature without ever being
# named. All three are now in `reflow2-core/src/foundation/` with a provenance
# header. Increment 4 of dec:absorb-the-foundation-subset-and-end-the-dependency
# — the one that ENDS the dependency. reflow2 no longer links anything from
# that repository.
#
# THE CRATES THEY BROUGHT WITH THEM, now declared here directly:
rmp-serde = "1"
tracing = "0.1"
lru = "0.18"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tantivy = "0.26"
# ⚠️ ABSORBED VERBATIM AT 0.24, WHICH IS A DECISION AND NOT AN OVERSIGHT.
# `rocksdb` is the historically-unmaintained wrapper; `rust-rocksdb` (0.52) is
# the maintained one and is where this should end up. Switching is deliberately
# NOT part of this change — dec:absorb-rocksdb-024-unchanged-then-switch-separately
# keeps the 86-file migration to ONE variable, so a failure has one cause. The
# switch gets its own PR.
rocksdb = "0.24"
# dynograph-graph was HERE until 2026-08-24. Absorbed: reflow2 imported eight
# names — Graph, GraphBuilder, betweenness_centrality, connected_components,
# cut_structure, find_cycle, leiden, strongly_connected_components — whose
# transitive closure is 2,219 of the crate's 3,832 lines. They now live in
# `reflow2-core/src/graphalg/` with a provenance header. Left behind: 1,613
# lines in nine files (centrality, closeness, clustering, eigenvector,
# link_prediction, maxflow, pagerank, shortest_path, toposort).
# Increment 3 of dec:absorb-the-foundation-subset-and-end-the-dependency.
# dynograph-resolution was HERE until 2026-08-24. Absorbed: reflow2 called
# `token_sort_ratio` and nothing else, so it and its closure (jaro,
# jaro_winkler, jaro_winkler_prepared, sort_tokens) now live in
# `reflow2-core/src/fuzzy.rs` with a provenance header. `resolver.rs` — 911 of
# the crate's 1,211 lines, an EntityResolver reflow2 never called — was left.
# Increment 2 of dec:absorb-the-foundation-subset-and-end-the-dependency.
# ⭐ THIS ALSO REMOVES dynograph-vector FROM THE BUILD: resolution was the last
# path to it after increment 1 took it out of this file. Two crates, not one.
# dynograph-vector was HERE until 2026-08-24. Absorbed: reflow2 called `mean`
# and `linear_regression_slope` and nothing else, so those two functions now live
# in `reflow2-core/src/stats.rs` with a provenance header naming the tag they
# came from. Increment 1 of dec:absorb-the-foundation-subset-and-end-the-dependency.
# NOTE: dynograph-resolution declares dynograph-vector itself, so cargo still
# builds it until increment 2 lands. One line out of here is not one crate out
# of the build, and saying otherwise would be the flattering reading.

# THE `[patch]` BLOCK FOR `dynograph-foundation` WAS HERE AND IS RETIRED. It let a
# session point the foundation crates at a local checkout for cross-repo dev.
# Nothing in this workspace depends on that source now, so uncommenting it would
# redirect nothing — cargo would report the patch as unused. Developing reflow2
# against an unreleased foundation is no longer a thing this workspace can do,
# because the code it would have patched is in-tree.

# ── Build-artifact size, and why this is set ────────────────────────────────
#
# Measured 2026-08-11 on the dev box: target/ had reached 288 GB and filled the
# root filesystem. It was not a leak — it is cargo's ordinary behaviour meeting
# this project's shape, and cargo never garbage-collects:
#
#   target/debug/deps   1,824 artifacts, 104 distinct names, 252 GB
#   the reflow2_mcp test binary alone      43 copies × ~313 MB
#
# Every integration test file links its own binary against RocksDB, and each
# rebuild mints a NEW hash-suffixed copy while the old ones stay forever. With
# ~50 test files and many rebuilds a day, that is several GB per working hour.
#
# `debug = "line-tables-only"` keeps what this project actually reads — panic
# backtraces with file and line, which is what every test failure is diagnosed
# from — and drops the variable/type DWARF that made each binary ~300 MB. It
# does NOT keep full local-variable inspection under a debugger; if you need
# that for a session, override it rather than removing this.
#
# This shrinks each NEW artifact. It does not collect old ones — cargo has no
# GC, so a periodic sweep of target/debug/deps (keep the newest artifact per
# name, delete the rest) is still worth running when the disk gets tight.
[profile.dev]
debug = "line-tables-only"
# Kept, but it earned far less than predicted and the numbers are recorded so
# nobody re-runs this experiment. The hypothesis was that since 88% of a test
# binary is `.debug_*`, and ~50 test binaries each embed their own copy of the
# same dependency DWARF, moving it beside the object files would be the big
# win. MEASURED, per test binary: 313 MB → 249 MB with line-tables-only alone
# → 233 MB adding this. So this line bought 6%, not a multiple.
#
# ⭐ THE REAL FIX WAS NOT A PROFILE SETTING AT ALL — it was that cargo has no
# GC. target/debug/deps held 1,824 artifacts under 104 distinct names (43
# copies of the reflow2_mcp test binary alone); sweeping the stale duplicates
# recovered 225 GiB against these settings' ~25%. Sweep first when the disk is
# tight; these settings only slow the refill.
#
# 🛑 AND HERE IS THE COMMAND, because the note above says WHAT to do and not
# HOW, and that gap cost a session a failed test run on 2026-08-24 — the disk
# hit 100% with 43 MB free, 263 GiB of it in 484,912 artifacts, 159,247 of them
# belonging to these two crates. Every `cargo test --workspace` mints another
# ~290 MB copy of the reflow2_mcp test binary and nothing removes the last one.
#
#     rm -rf target/debug/incremental                # free, pure cache, 22 GB
#     cargo clean -p reflow2-core -p reflow2-mcp     # 263 GiB, ~2 min
#
# THE `-p` FLAGS ARE THE WHOLE POINT. A bare `cargo clean` reclaims the same
# space AND destroys the cached librocksdb-sys C++ build — a ~19-minute rebuild
# bought for nothing, because the bulk is NOT RocksDB (its artifact is 856 MB,
# 0.3% of the problem). Scoped, only our own two crates recompile.
# Measured: fact:the-target-dir-reached-263-gib-of-this-projects-own-test-binaries
split-debuginfo = "unpacked"

# Tests are the bulk of the artifacts, and they inherit dev rather than reading
# [profile.dev] directly — stated explicitly so the intent survives a reader who
# only greps for "test".
[profile.test]
debug = "line-tables-only"
split-debuginfo = "unpacked"
