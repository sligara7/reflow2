# reflow2 dependency declarations — which version of another design this
# design depends on. GENERATED: re-derive it from the build files rather
# than editing by hand, because a hand-kept pin drifts from the build and
# the build is what ships.

[reflow2]
version = "0.34.0"
graph_id = "reflow2"

[dependencies.dynograph-foundation]
source = "https://github.com/sligara7/dynograph-foundation.git"
version = "v0.12.0"
components = ["dynograph-core", "dynograph-storage", "dynograph-graph", "dynograph-resolution", "dynograph-vector"]
features = ["rocksdb", "fulltext"]
declared_in = "Cargo.toml"
note = "Derived from reflow2's own Cargo.toml, not hand-written. Bumped v0.11.0 -> v0.12.0 on 2026-07-28 for a stated reason rather than as housekeeping (AGENTS.md forbids the latter): v0.12.0 closes a type leak reflow2 was structurally exposed to — `search_fulltext` returned `dynograph_text::TextHit`, from a crate reflow2 never names and reaches only through an optional feature — and it makes the `rocksdb` and `fulltext` feature NAMES a committed contract upstream, which is exactly the reliance this declaration records. Verified before the tag existed by building this consumer against the provider's unreleased tree. MIGRATION CHECKED, not assumed: `keys.rs` and `backend.rs` are untouched between the tags, so a graph written by v0.11.0 reads identically."
