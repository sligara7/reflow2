# build.yaml — P3 Realization layer (BUILD).
#
# The concrete things produced when the design is built, and the unit of work
# by which change enters the graph.

schema:
  name: build
  version: 1

  node_types:

    Artifact:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        description: { type: string, fulltext: true }
        artifact_type: { type: enum, values: [code, config, document, spec, diagram, model, drawing, test_result, binary, data, asset], default: code, indexed: true, description: "code=source; spec=machine-readable contract (OpenAPI/protobuf); diagram=dataflow/sequence/arch chart; document=design doc/ADR/readme; test_result=report/coverage; model/drawing=CAD." }
        location: { type: string, indexed: true, description: "File path, URI, content-hash, or physical identifier of the realized thing (the artifact lives outside the graph; this points to it)." }
        signature: { type: string, description: "Function/class signature, part number, or spec identifier." }
        checksum: { type: string, description: "Content hash of the artifact as last reconciled with the design. The baseline drift detection compares against; a differing hash is a checksum_change DriftEvent. Opaque to reflow2 — the caller chooses the algorithm and supplies the value." }
        status: { type: enum, values: [planned, in_progress, realized, verified], default: realized, indexed: true }
        audience: { type: enum, values: [consumer, internal], indexed: true, description: "WHO THIS DELIVERABLE IS FOR: `consumer` = a user of the product reaches it; `internal` = it exists to serve the project's own machinery (CI, a release script, a coordination board). DELIBERATELY UNDEFAULTED and never inferred \u2014 unknown is a true answer, and a stored default would make every artifact assert an audience nobody chose (req:defaults-do-not-assert). NEVER DERIVED FROM A PATH: a first sketch classified by directory (.github/ internal, crates/ shipped), which encodes ONE project's layout and is exactly the failure req:work-says-whether-it-reaches-a-consumer exists to prevent. The distinction is universal \u2014 every project that ships anything has internal machinery and a delivered product, and confuses them under pressure \u2014 but only the project can say which is which. Read by the internal_only_delivery finding, which reports NOTHING TO RUN ON when no artifact declares one, because a detector answering zero over an empty population reads exactly like one that ran clean."}
        created_at: { type: string }
        last_confirmed_at: { type: string, description: "When this artifact was last OBSERVED to still match its recorded checksum (BL-158). Written by a recording reconcile_artifacts pass on a clean match, and by nothing else. Deliberately a property rather than an event: a confirmation is high-frequency and says nothing changed, so recording each one as a node would flood axis Z with non-events — the same shape as Verification.last_run_at, which answers the same question about a check." }
        granularity: { type: enum, values: [atomic, opaque, pending_expansion], indexed: true, description: "Whether this node stands for ONE thing or many, and if many, whether that is deliberate (BL-188). `atomic` = one addressable deliverable, the ordinary case, and what `coverage.rs` reads when nobody said — DELIBERATELY UNDEFAULTED (2026-08-15, music_graph F23): a stored default made every restored Artifact assert an intent nobody expressed, and the reader already supplies this reading via `unwrap_or`, so declaring it here bought nothing and cost the round trip. `opaque` = a directory or vendored mass claimed as a unit ON PURPOSE — a settled archive, a third-party tree — do not descend. `pending_expansion` = a PLACEHOLDER standing in for items that should each become their own node, nobody has got to it yet. The distinction exists because those two states are opposite and read identically today: the adopt skill's rule is that a directory artifact claims its whole subtree, so a registration check reports GREEN over files that are individually unreferenceable, and coverage_report counts the directory path as covering everything beneath it. Deliberately carries NO count of what it stands for: reflow2 does no file IO, so a stored number would be a caller-supplied figure nothing can recompute — the very staleness BL-187 exists to name. The count belongs to whoever is holding the disk at the time of asking." }
        volatility: { type: enum, values: [stable, append_only, living], indexed: true, description: "How this artifact's CONTENT is expected to behave over time, so drift detection can tell an expected change from a real one (BL-191). `stable` = a source file; any content change is drift worth reporting, and is what `drift.rs` reads when nobody said, because it is the safe reading — DELIBERATELY UNDEFAULTED (2026-08-15, music_graph F23), for the same reason as `granularity` above: the safe reading belongs in the reader, which already has it, not in the store, where it becomes an assertion nobody made. `append_only` = a log, a coordination bus, a changelog: it grows by design. `living` = a continuously-edited document. For the latter two a checksum change is EXPECTED and is reported as `expected_change` — still surfaced, never silently dropped, but not written to the drift ledger and not demanding a disposition on every reconcile forever. Measured before this existed: five coordination buses modelled per the adopt skill's own instruction produced five checksum_change divergences within minutes, all correct and all meaningless, and that ritual was owed again on every pass — the signal-trained-to-be-ignored failure, arrived at by following the skill correctly. ABSENCE still fires at full severity for every volatility, because a missing bus is a real finding. NOT here, and deliberately: shrink detection. A shrink is the genuinely alarming event for an append-only file, and a checksum cannot express it — it needs a size baseline nothing records, and the reporter's own caveat is that deliberate compaction shrinks these files, so the heuristic needs the design's consent rather than a bare rule." }
      embedding_field: description
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 85 }
      extraction_hint: >
        A concrete, addressable deliverable that lives OUTSIDE the graph and is
        pointed to by `location` — a source file, an OpenAPI spec, a dataflow
        chart, a design doc, a CAD model, a test report. Links to the entity it
        serves via REALIZES (code implements a Capability/Component), SPECIFIES
        (a spec defines an Interface), DOCUMENTS (a doc/diagram describes any
        node), or PRODUCES (a Verification emits a test_result). Large/binary
        artifacts are referenced, never inlined — an indexed `description`
        carries the searchable summary.

    Fragment:
      properties:
        title: { type: string, required: true, indexed: true, fulltext: true }
        summary: { type: string, fulltext: true }
        intent: { type: string, fulltext: true, description: "What this unit of work was meant to accomplish (the fragment's own inline author-intent)." }
        fragment_type: { type: enum, values: [implementation, test, design, spec, config, review, bug_fix, refactor, documentation, note, pseudocode, feedback], indexed: true, description: "Purpose of the fragment. Primary content (implementation/test/spec/config) vs. the parallel NOTE layer (note=author intent, pseudocode=pre-implementation sketch, review/feedback=reviewer commentary) that ANNOTATES it." }
        note_kind: { type: enum, values: [author, reviewer, director], description: "For note/review/feedback/pseudocode fragments: whose voice it is. author=the implementer's intent/pseudocode; reviewer=feedback; director=guidance on how to build. Mirrors storyflow SceneDirection.note_kind. Null for primary content." }
        phase: { type: enum, values: [P0, P1, P2, P3, P4, P5, PM], indexed: true }
        provenance: { type: enum, values: [authored, planned, inferred, healed, reconciled, imported], default: authored, indexed: true, description: "How this content entered the graph." }
        content_ref: { type: string, indexed: true, description: "Pointer to the source content (path/hash) rather than inlining it." }
        status: { type: enum, values: [ingested, integrated, superseded], default: ingested, indexed: true }
        created_by: { type: string, indexed: true }
        created_at: { type: string }
      embedding_field: summary
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 88 }
      extraction_hint: >
        The unit of work by which content enters the graph: a chunk of design
        prose, a code change, a review note. Fragments are what the extraction
        pipeline ingests; the entities/edges they yield are linked back with
        YIELDED. A revised fragment SUPERSEDES its prior version. A NOTE-layer
        fragment (note / pseudocode / review / feedback) ANNOTATES the primary
        fragment or Artifact it comments on — running side-by-side with the code,
        not producing graph entities itself.

  edge_types:

    REALIZES:
      from: Artifact
      to: "*"
      extraction_hint: An Artifact implements/realizes a Capability or Component.
      properties:
        completeness: { type: enum, values: [stub, partial, complete] }
        # Added 2026-08-16 for `dec:should-a-realizes-edge-say-that-nobody-checked-the-file-still-obeys-the-rule`.
        conformance: { type: enum, values: [unchecked, reviewed, verified], default: unchecked, indexed: true, description: "Whether anyone confirmed this artifact still does what the target REQUIRES — a different question from `completeness`, which says how much of it exists, and from the Artifact's `checksum`, which says only that the file has not MOVED since we last looked. `unchecked` (the default) means nobody has confirmed it, `reviewed` means a person read it against the requirement, `verified` means a check exercises the specific property. WHY THIS EXISTS, and it came from outside: a Requirement said the calendar day is the person's CIVIL date; the code used UTC; the Capability said `realized`; the checksum matched so `reconcile_artifacts` was silent — EVERY SIGNAL IN THE GRAPH WAS GREEN AND A USER FOUND THE BUG IN THE PRODUCT. Nothing distinguished a file CHECKED AGAINST THE RULE from a file MERELY HASHED, and the two produced identical reports. THE DEFAULT IS A RECORD, NOT A CLAIM (req:defaults-do-not-assert): no edge written before this had been checked in any way the graph could see, so `unchecked` states what the record has always meant rather than inventing a judgement about it — the same argument DesignEpoch.status made for `arrived`. REFLOW2 NEVER COMPUTES THIS. It reads a design, never a running system, and deciding whether code implements a civil-date rule is program analysis it deliberately stays out of (`dec:agent-navigates-content`); this RECORDS what a person knows. READ, not merely stored — `evidence_report` counts how many realizing edges nobody has checked, which is the whole deliverable: the silence becomes a number. (Deliberately NOT `coverage_report`, which needs a caller-supplied file sweep, and NOT `loop_status`, where a large figure that never moves would be the signal-trained-to-be-ignored failure all over again.)" }

    SPECIFIES:
      from: Artifact
      to: ["Interface", "Capability", "Component"]
      extraction_hint: >
        A machine-readable contract artifact defines an entity — an OpenAPI /
        protobuf / JSON-schema / IDL file SPECIFIES an Interface (its
        authoritative contract). Distinct from DOCUMENTS (human explanation) and
        REALIZES (executable implementation).
      properties:
        format: { type: string, description: "openapi / protobuf / json_schema / graphql / asyncapi / idl." }

    DOCUMENTS:
      from: Artifact
      to: "*"
      extraction_hint: >
        A descriptive artifact explains an entity without implementing it — a
        design doc, ADR, README, or a dataflow/sequence/architecture diagram
        DOCUMENTS a Component, Flow, Decision, Interface, or the Project.
      properties:
        doc_kind: { type: string, description: "design_doc / adr / readme / dataflow / sequence_diagram / arch_diagram / runbook." }

    PRODUCES:
      from: Verification
      to: Artifact
      extraction_hint: >
        A Verification run emits a result artifact — a test report, coverage
        file, simulation output, or inspection record (artifact_type=test_result
        / data). The pass/fail summary stays on the Verification; this links the
        durable evidence.
      properties:
        outcome: { type: enum, values: [pass, fail, partial, error] }

    YIELDED:
      from: Fragment
      to: "*"
      extraction_hint: >
        A Fragment produced (created or updated) this node during extraction.
        Provides provenance from any node back to the work that introduced it.
      properties:
        action: { type: enum, values: [created, updated, merged] }

    SUPERSEDES:
      # WIDENED 2026-08-23 to accept Verification -> Verification. A check
      # consolidated into a broader one had no way to say so: this edge was
      # refused for the pair whose NAME describes it exactly, and the honest
      # fallback (`EVOLVES_INTO`, a double wildcard) cannot be told apart from
      # "these two happen to be linked". Filed by dragon Boss 2026-08-22 after
      # folding two one-off probes into one table-driven check.
      #
      # ⚠️ ENUMERATED `from`/`to` IS A CROSS PRODUCT, NOT A PAIR LIST — so this
      # also admits Fragment -> Verification and Verification -> Fragment, which
      # are meaningless. The schema has no way to express "these pairs only",
      # and stating that here is cheaper than pretending it does. Both nonsense
      # combinations are writable and neither is read by anything.
      #
      # 🛑 THIS WIDENING IS INVISIBLE TO THE SCHEMA STAMP, which counts edge
      # TYPE NAMES and SUPERSEDES already existed. An older binary opens such a
      # graph without complaint and then faults on the specific edge at import.
      # It ships alongside two NEW edge types deliberately, so the stamp move
      # they force is what protects this change too.
      from: [Fragment, Verification]
      to: [Fragment, Verification]
      extraction_hint: >
        A revised Fragment replaces an earlier version; a Verification replaces
        a narrower check it absorbed. Pair the target's status with
        `superseded` so a retired check stops reporting live coverage.
      properties:
        diff_summary: { type: string }

    ANNOTATES:
      from: Fragment
      to: "*"
      extraction_hint: >
        A NOTE-layer fragment (note=intent, pseudocode, review, feedback)
        attaches side-by-side to the thing it comments on — the primary code
        Fragment, an Artifact, or any design entity (Capability, Component,
        Decision). The reflow2 analog of storyflow's DIRECTS (author/director
        notes beside a narrative fragment). Human commentary; does NOT produce
        graph entities (that's YIELDED) and is NOT machine SME output (that's
        SUPPLEMENTS).
      properties:
        note_kind: { type: enum, values: [author, reviewer, director], description: "Whose voice: author intent/pseudocode, reviewer feedback, or director guidance." }
        resolved: { type: bool, default: false, description: "For review/feedback: whether the comment has been addressed." }

    SUPPLEMENTS:
      from: Fragment
      to: Fragment
      extraction_hint: >
        Links an LLM-as-SME supplementary-analysis Fragment (provenance=inferred)
        to the source Fragment it augments — the design-world analogue of
        storyflow's SUPPLEMENTS. Carries the grounding label so speculative vs.
        established SME input stays visible.
      properties:
        grounding: { type: enum, values: [verified, extrapolated, speculative, contradicts_known], default: extrapolated, description: "How grounded the SME input is (storyflow's grounding spectrum)." }
        domain: { type: string, description: "SME knowledge domain — logistics, structural, thermal, regulatory, propulsion, etc." }
