# core.yaml — P0 Intent layer.
#
# The "why we're building this" foundation: the project itself, the needs it
# must satisfy, the limits it must respect, and the standards it adopts.
# Domain-neutral: a Project can be software, a physical product, a document,
# or a process.

schema:
  name: core
  version: 1

  node_types:

    Project:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        domain: { type: string, indexed: true, description: "software / hardware / document / process / other — free text; scopes vocabulary examples, not validation." }
        description: { type: string, fulltext: true }
        objective: { type: string, description: "One-line statement of what success looks like." }
        decomposition_levels: { type: "list:string", description: "THIS DESIGN'S DECOMPOSITION LADDER, ordered BOTTOM-FIRST — index 0 is the finest rung. Absent means the built-in default [component, subsystem, system, system_of_systems, enterprise], so a design that never says anything behaves exactly as before. Set it when your domain bottoms out somewhere else: an airframer stops at a bought engine, a software design at a code module, and a fixed ladder asserts every domain bottoms out at the same conceptual depth (dec:the-decomposition-ladder-is-open-not-a-fixed-enum). Component.level names a rung from this list; hierarchy_issues ranks by POSITION here rather than by a compiled-in order, and reports a level that is not on the list as `unknown_level`. HOW DEEP IS DEEP ENOUGH is not answered here and reflow2 does not judge it — the four standard stopping rules (procurement black box, LRU/maintenance, single discipline or owner, verification cost) are recorded on fact:the-level-ladder-has-a-hard-floor-at-component-and-no-assembly-rung." }
        mode: { type: enum, values: [flexible, rigid], default: flexible, description: "Governance: how much a machine may change the design on its own. flexible = apply_heal applies structural repairs; rigid = it proposes them and stops, so a human decides. That one gate is ALL this currently changes — deliberately narrower prose than the older 'design is the source of truth', which promised a breadth the code does not implement. Set it with set_project_mode; the default records that nobody has chosen yet, not that flexible was chosen." }
        status: { type: enum, values: [active, paused, archived], default: active, indexed: true }
        created_at: { type: string }
        # ---- Federation (dec:nested-graphs option (c), 2026-07-25) ----------
        # A design is its own graph when something is separately owned, released
        # or shared. Designs then link by MIRRORING each other's published
        # surface: the other side's nodes land here as local nodes, and this
        # Project node is the mirror's identity — which design, which version,
        # when. Edges cannot cross stores (the schema validates both endpoints),
        # so foreignness is a property of the NODE, never of the link, and your
        # own components PROVIDE/CONSUME a mirrored Interface with ordinary local
        # edges. Absent on your own project; present only on a mirror.
        mirror_of: { type: string, indexed: true, description: "The `graph_id` of the design this Project is a MIRROR of. Present only on a mirrored (foreign) project: this node is somebody else's design as we received it, not ours to edit. Its absence means the project is our own." }
        mirror_content_hash: { type: string, description: "The `content_hash` of the published-surface document this mirror was made from — the coordinate, in dec:fork-point-address's sense: a version resolved against a document rather than a live reference. A newer surface with a different hash means this mirror is stale, which is what makes staleness computable instead of assumed." }
        mirror_nodes: { type: string, description: "Comma-joined ids this mirror brought in, recorded on the mirrored Project so a later REFRESH can replace exactly this set. It cannot be recovered afterwards: `provenance: imported` is also set by corpus ingest, and the project's CONTAINS edges do not span the mirrored set. Present only on a mirrored (foreign) project." }
        mirrored_at: { type: string, description: "When the mirror was taken. A mirror is a dated CLAIM about a version of another design, never a live truth (the cap:freshness discipline), so the date is part of the record rather than metadata." }
      embedding_field: description
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 85 }
      extraction_hint: >
        The top-level thing being designed and built. There is normally one
        Project per graph. Extracted from a brief, charter, or the opening
        framing of a design conversation.

    Requirement:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        statement: { type: string, required: true, fulltext: true, description: "The need in the stakeholder's own terms." }
        kind: { type: enum, values: [functional, nonfunctional, quality, business], indexed: true }
        concern: { type: enum, values: [core, logistics, sustainment, safety, security, cost, schedule, manufacturability, usability, environmental, other], indexed: true, description: "Cross-cutting concern this need belongs to. 'logistics'/'sustainment' cover the ILS considerations an SME surfaces (supply, transport, build method, maintenance)." }
        priority: { type: enum, values: [low, medium, high, critical], default: medium, indexed: true }
        source: { type: string, description: "Who/what stated it — a user, a regulation, a stakeholder." }
        rationale: { type: string }
        status: { type: enum, values: [proposed, accepted, deferred, dropped, met], default: proposed, indexed: true }
        lineage: { type: enum, values: [original, decomposed, derived], default: original, indexed: true, description: "Where this requirement came from, which is distinct from `provenance` (how it entered the graph). `original` is the stakeholder's own word. `decomposed` is a 1:1 split of a parent adding no new information — it DECOMPOSES that parent, and satisfying every child satisfies it. `derived` is technical necessity nobody asked for, created by a design decision — it is GOVERNED_BY that Decision, and if the decision is re-opened the requirement may lose its reason to exist. The classes behave differently under delivery roll-up and under re-forking, which is why the distinction is stored rather than inferred." }
        provenance: { type: enum, values: [authored, planned, inferred, healed, reconciled, imported], default: authored, indexed: true, description: "How this node entered the graph. Same vocabulary as Fragment.provenance. `inferred` is the load-bearing one: a requirement read back out of the code that implements it is satisfied by construction and can never contradict anything, so it must be distinguishable from one a stakeholder actually stated." }
        # Added 2026-07-28 by req:publishable-promise, found by a real cross-repo
        # trial: dynograph-foundation published its surface to reflow2 and could
        # not express the one commitment its consumer most needed — that
        # `open_rocksdb` fails loud rather than silently falling back to memory.
        # export_surface withholds every Requirement as internal, and behavioural
        # commitments LIVE in Requirements, so the published surface carried
        # structure and no promises. The consumer's build file ended up asserting
        # the provider's promise in a code comment, on the wrong side of the seam,
        # where the provider would never see it change.
        #
        # Same enum, same default and the same reason for the default as
        # Interface.designation: publishing is a commitment, and defaulting to it
        # would assert one nobody made. Most requirements are internal intent and
        # must stay withheld — this is opt-in, per requirement.
        designation: { type: enum, values: [internal, published], indexed: true, description: "Whether this requirement is a PROMISE THIS DESIGN PUBLISHES — a behavioural commitment a consumer is entitled to rely on — or internal intent nobody outside gets to see. `published` is what an ICD states in prose and what no structural export can carry: 'fails loud rather than falling back', 'ordering is preserved', 'an empty result means no match, not an error'. Read by `export_surface`, which withholds every `internal` requirement and carries every `published` one, so a promise travels with the boundary it constrains and every existing drift and reconcile check applies to it unchanged. Default `internal` on purpose (req:publishable-promise): most requirements are the design's own reasoning, and publishing one is a commitment that must be made deliberately — the same rule as Interface.designation. NOT a claim the promise is kept: whether it held is its verification and drift history, which is evidence rather than a property anyone sets." }
      embedding_field: statement
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 80 }
      extraction_hint: >
        A stated need or goal the design must satisfy — the bridge between raw
        intent and concrete Capabilities. Extract one per distinct need. A
        Capability later SATISFIES one or more Requirements.

    Constraint:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        statement: { type: string, required: true, fulltext: true }
        category: { type: enum, values: [technical, business, operational, physical, regulatory, budget, schedule, kpp], default: technical, indexed: true, description: "`kpp` marks a KEY PERFORMANCE PARAMETER: inviolable intent, in the acquisition sense — a threshold that, if missed, fails the effort regardless of how well everything else went. Distinct from an ordinary Constraint (a limit imposed on the design, tradeable against other limits) and from a Requirement (a goal to achieve). Modelled as a Constraint subtype rather than its own node type on the user's call (2026-07-25) because the quantity/limit/direction triple and the budget rollup are exactly what a KPP needs and already exist. Its violations are computed, never remembered, and are ranked above ordinary gaps." }
        concern: { type: enum, values: [core, logistics, sustainment, safety, security, cost, schedule, manufacturability, usability, environmental, other], default: core, indexed: true, description: "Cross-cutting concern (ILS facet). Lets logistics/sustainment limits be filtered without a separate node type." }
        priority: { type: enum, values: [low, medium, high, critical], default: medium, indexed: true }
        rationale: { type: string }
        # BL-11: a numeric budget. `quantity` names what is budgeted with its
        # unit ("mass_kg", "latency_ms", "cost_usd"); `limit` is the number;
        # `direction` says which side violates. Contributions live on the
        # CONSTRAINS edges to the parts that spend the budget.
        quantity: { type: string, indexed: true, description: "Unit-bearing name of the budgeted quantity — e.g. mass_kg, latency_ms, power_w, cost_usd." }
        limit: { type: float, description: "The budget number, in the quantity's unit." }
        direction: { type: enum, values: [maximum, minimum], default: maximum, description: "maximum = total must stay at or under the limit; minimum = at or over." }
        objective: { type: float, description: "For a `kpp`: the OBJECTIVE value, the desired performance, where `limit` carries the THRESHOLD — the minimum acceptable. The acquisition pair: missing the threshold fails the effort, reaching the objective is what success looks like. Optional, because many KPPs state only a threshold, and inventing an objective nobody set would be a number the graph asserts on its own." }
      embedding_field: statement
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 80 }
      extraction_hint: >
        A limit or rule the design MUST respect (vs. a Requirement, which is a
        goal to achieve). "Must run offline", "budget under $5k", "no PII
        leaves the device", "fits in a 2U rack". Nodes CONSTRAINS-linked to
        what they bind, or SATISFIES-linked from what honors them.

    DesignRule:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        statement: { type: string, required: true, fulltext: true }
        category: { type: string, indexed: true, description: "tech_stack / convention / material / methodology / standard / style." }
        # NO DEFAULT, DELIBERATELY (Anthony, 2026-08-08,
        # dec:does-enforced-default-to-gate-blocking). Three states: true =
        # violations are gate-blocking; false = advisory; ABSENT = nobody has
        # said, which is REPORTED as unstated and never read as either.
        #
        # It defaulted to `true` until now, so a convention recorded in passing
        # asserted it could fail somebody's build and then owed a detector
        # nobody agreed to — which is how all four of this project's own
        # enforced rules got that way, none of them chosen.
        #
        # Flipping the default to `false` was considered and REFUSED as unsafe:
        # the value is materialized into the store at write time (confirmed by
        # its presence in a 0.24.0 export, which omits unset properties), so an
        # inherited `true` is indistinguishable from a chosen one and any
        # migration would either silently downgrade rules somebody meant or
        # preserve rules nobody chose, undetectably.
        #
        # Absence-is-reported-as-absence is this schema's own most consistent
        # rule — VERIFIES.pinned ("unset means the scope was never stated"),
        # Constraint.objective ("unset is a true answer"), weight_basis,
        # DUPLICATES.basis — and `enforced` was the one place it was broken, in
        # the dangerous direction.
        enforced: { type: bool, description: "Whether violations are gate-blocking. THREE STATES: true = gate-blocking (and owes a detector); false = advisory; ABSENT = nobody has stated it, reported as unstated and never read as enforced. Never defaulted: whether breaking a rule should stop somebody's build is a policy about consequence, and it is the user's to state (the GATED_ON.min_level argument, one layer along)." }
      embedding_field: statement
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 80 }
      extraction_hint: >
        A chosen standard or convention the build adopts — a tech-stack choice,
        a coding/style convention, a preferred material, a methodology. Broader
        than a Constraint: a rule you picked, not a limit imposed on you.

    Question:
      properties:
        question: { type: string, required: true, fulltext: true, description: "The question as it was actually put to the user, in their language. IMMUTABLE BY DESIGN AND NOT BY OVERSIGHT: no tool edits this field, because the `answer` stored beside it was given to these exact words, and rewriting them would make the record a claim about what somebody wishes they had asked. Two projects looked for an edit tool on 2026-09-02 and the absence cost them more than the wording did, so it is stated here rather than left to be discovered (dec:idea-a-recorded-questions-wording-can-be-corrected). A question asked BADLY and one overtaken by events are different facts \u2014 `withdraw_question` is for the second." }
        gap_id: { type: string, required: true, indexed: true, description: "The gap this was asked about. Deterministic, so a later session finds the question without an index. DELIBERATELY NOT `node_ref`, and the omission is a decision rather than an oversight: a gap is COMPUTED by detect_gaps and is never stored as a node, so this id resolves to nothing BY CONSTRUCTION. Measured 2026-08-29: 57 values, 0 resolve — and that is the correct reading, not rot. Declaring `node_ref` would refuse every Question this design has ever written. It is not a node reference at all; it names a finding." }
        prompt_id: { type: string, indexed: true, description: "Id of the LLM request that phrased it, so identical phrasings are recognisable across sessions." }
        context_setter: { type: string, fulltext: true, description: "The 1-2 sentences that placed the user back in their own design." }
        rephrase_degraded: { type: bool, default: false, description: "True when phrasing fell back to the raw gap text — the question was still asked, and the record says how well." }
        asked_at: { type: string, description: "When it was put to the user." }
        answer: { type: string, fulltext: true, description: "What the user said, in their own words. The design nodes it produced are linked separately." }
        status: { type: enum, values: [asked, answered, withdrawn], default: asked, indexed: true }
      embedding_field: question
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 85 }
      extraction_hint: >
        A question already put to the user about a gap, and whether they have
        answered it. Not extracted from prose — authored by the DETECT→PROMPT
        loop so that a later session can tell what has already been asked
        instead of re-deriving and re-asking it. ASKS_ABOUT points at the nodes
        the gap concerned.

    Contributor:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        description: { type: string, fulltext: true }
        kind: { type: enum, values: [person, automated_agent, organization], default: person, indexed: true, description: "What the contributor IS — a human, an automated coding agent (Claude Code, grok build), or an organization. An agent that acts on a person's behalf ACTS_FOR them (deferred rung)." }
        handle: { type: string, indexed: true, description: "Short stable handle used to coordinate — e.g. the COORD.md board handle (@ajs) or an agent's name. Lets the same contributor be recognised across sessions without matching on the display name." }
      embedding_field: description
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 82 }
      extraction_hint: >
        Who authors and decides the DESIGN itself — a person, an automated
        coding agent, or an organization. Distinct from an Actor, which is who
        the designed system SERVES: a Contributor sits on the *making* side, an
        Actor on the *use* side, and conflating them blurs two different
        lifecycles. A design node AUTHORED_BY a Contributor records whose word
        it is — the structured "who" behind provenance's "how" — and is the one
        identity the certainty doctrine, claims, and alternative-authorship all
        attach to. Not extracted from design prose; recorded from who is
        actually driving the session.

  edge_types:

    CONTAINS:
      from: ["Project", "Component"]
      to: "*"
      extraction_hint: >
        Ownership/containment: from the Project down to any node, and between
        Components to express the axis-Y decomposition spine (a system CONTAINS
        its subsystems CONTAINS its parts — see Component.level / matryoshka).
      properties:
        note: { type: string }

    CLAIMS:
      from: Contributor
      to: "*"
      extraction_hint: >
        A Contributor has taken a region of the design in hand, so others can see
        what is already held before starting. ADVISORY, never a lock: the design
        lives as a file in each person's checkout with no shared server to hold a
        lock, so a claim cannot block anyone and must never be read as if it
        could. The claim names a SEED and a depth; the region itself is computed
        from them, so it follows the design as the design changes instead of
        going stale. Deliberately NOT a traceability edge (absent from
        structural_rule, like AUTHORED_BY) — who is working on something is
        coordination, not design structure, and letting it propagate would put
        people into blast radii.
      properties:
        depth: { type: int, default: 2, description: "How far from the seed the claimed region reaches, in hops." }
        claimed_at: { type: string }
        note: { type: string, description: "Why it is held / what is being done — the thing a colleague actually wants to know." }
        seat: { type: string, description: "The SESSION that made the claim, as <machine>:<pid>:<mint> — assigned with zero coordination, never negotiated (dec:identity-out-of-band). It is what makes liveness COMPUTABLE: a claim whose session has exited is a ghost, and a ghost that reads as live makes the overlap report lie. A claim with no seat is from before this existed, and is reported as unknown rather than assumed live." }

    DECOMPOSES:
      from: Requirement
      to: Requirement
      extraction_hint: >
        Child DECOMPOSES parent: a 1:1 split of one requirement into smaller
        testable pieces that adds no new information ("the app must have a
        checkout system" becomes enter-a-card, apply-a-discount, receive-a-
        receipt). Distinct from a DERIVED requirement, which adds new technical
        necessity nobody asked for and hangs off the Decision that forced it,
        not off a parent goal. The direction is child→parent so a leaf can find
        its ancestry without the parent enumerating its children, and because
        satisfying every child is what satisfies the parent — delivery rolls
        UP this edge.
      properties:
        note: { type: string }

    SATISFIES:
      deliberately_open:
        from: [Capability, Component, Artifact]
        to: [Requirement, Constraint]
      from: "*"
      to: "*"
      extraction_hint: >
        Source node (Capability, Component, Artifact...) fulfills a target
        Requirement or Constraint. The backbone of design traceability.
      properties:
        coverage: { type: enum, values: [full, partial, planned] }
        evidence: { type: string }

    AUTHORED_BY:
      from: "*"
      to: Contributor
      extraction_hint: >
        A design node was authored, reviewed, or approved by a Contributor —
        the structured "who" behind provenance's "how". Deliberately NOT a
        traceability edge: it is absent from the impact table (nodes.rs
        structural_rule) on purpose, so authorship never propagates a blast
        radius and never makes a Contributor a hub in the design network. It is
        design metadata on axis Z, the seed the claims and certainty threads
        build on.
      properties:
        role: { type: enum, values: [author, reviewer, approver], default: author, indexed: true, description: "How this contributor stood to the node — who wrote it, who reviewed it, whose sign-off it carries." }
        acted_at: { type: string, description: "ISO-8601 timestamp of the authorship act, if recorded." }

    OWNED_BY:
      from: "*"
      to: Contributor
      extraction_hint: >
        Whose AREA this is — durable, standing, and never released. THE THIRD
        "WHO" AXIS, and the one that was missing: AUTHORED_BY says who WROTE
        this (past tense, historical, never changes); CLAIMS says who is IN it
        RIGHT NOW (transient, advisory, released at checkout); this says whose
        ground it is, which survives every session. Anthony's case, 2026-08-09:
        "there are areas of the design that are his and areas that are mine...
        it is probably durable, survives every session, and should never be
        released." That is two people splitting a design — the ordinary case of
        collaborative work, not a multi-agent one.

        WHY IT IS NOT CLAIMS, which was the cheap answer and is wrong on every
        property: claim_region is advisory and session-scoped by its own
        description, the parallel-work skill says release at checkout, and on a
        shared server a claim reads `unknown` rather than `live` and never
        expires on its own. Standing ownership claims would permanently drown
        the tool's actual job — showing who is ACTIVELY in your ground.

        Deliberately NOT a traceability edge — absent from structural_rule, the
        THIRD of a kind after AUTHORED_BY and CLAIMS — so ownership never
        propagates a blast radius and never makes a Contributor a hub. Owning
        something says who answers for it, not that a change to it changes them.

        NOT A CLAIM THAT EVERYTHING SHOULD HAVE ONE. Most nodes in a mature
        design legitimately have no owner, so absence here is ordinary and is
        deliberately NOT reported as a gap: whether unowned ground should be
        detected, and which types are even ownable, is open in
        dec:idea-detect-ownership-orphans and turns on a per-project answer.
      properties:
        note: { type: string, description: "What is actually owned, and any bound on it — the sentence a colleague needs when they find your name on something. An owner with no note is still an owner; this is where 'the ingest half, not the export half' goes." }
        since: { type: string, description: "ISO-8601 date ownership was taken, if recorded. The core takes no clock, so the caller supplies it." }

    ANSWERS:
      # TARGET ENUMERATED, SOURCE DELIBERATELY OPEN.
      #
      # THE SCHEMA ALREADY DESCRIBED THIS EDGE BEFORE IT EXISTED. Question.answer
      # reads "The design nodes it produced are linked separately" — and nothing
      # linked them. Measured 2026-09-02: describe_schema{Decision, Question}
      # returned ZERO exact and ZERO half-exact matches, so the only way to say
      # "this decision is what the user's answer became" was a `*`/`*` edge that
      # validates and means nothing.
      #
      # THREE INDEPENDENT REPORTS WANTED THIS ONE EDGE: proj:chama read loop debt
      # on a correctly-deferred answer (2026-09-02); api-boss found a Question
      # created outside gap_to_prompt permanently unanswerable and proposed
      # exactly this as fix (3) (2026-08-15); and the question of whether a
      # Question's wording can be amended needs somewhere to hang the amendment.
      #
      # `to` IS PINNED so describe_schema ranks it half_exact rather than burying
      # it among the both-sides wildcards — applying the lesson of
      # fact:governed-by-is-the-governance-edge-and-describe-schema-can-never-rank-it,
      # where the RIGHT edge existed and the ranking hid it.
      #
      # `from` STAYS OPEN because an answer is not always a Decision: it can land
      # as a Requirement, a Capability, or a status move. Enumerating it would
      # refuse the honest cases, and narrowing a wildcard later is a
      # consumer-facing break.
      from: "*"
      to: Question
      extraction_hint: >
        The design record that ANSWERED a question — the Decision, Requirement
        or Capability the user's reply actually became. Reads as a sentence:
        the RECORD answers the QUESTION. Draw it when you write the answer in,
        so a later session can tell an answer that reached the design from one
        that only reached the chat.

        ⚠️ ITS ABSENCE MEANS "NOBODY SAID", NOT "NOT WRITTEN IN". Every design
        written before 2026-09-02 has answered Questions and no ANSWERS edges,
        so treating a missing edge as evidence of missing work would invent
        debt on every existing graph. Reports read the edge as POSITIVE
        evidence only.
      properties:
        note: { type: string, description: "HOW this record answers the question — the sentence a later reader needs when the answer is not obvious from the record alone." }

    ASKS_ABOUT:
      from: Question
      to: "*"
      extraction_hint: >
        The design nodes a question was raised about — the gap's affected set at
        the moment it was asked. Lets a node say "someone has already been asked
        about this", and lets an answered question stay reachable from the part
        of the design it settled.
      properties:
        note: { type: string }

    COMPLEMENTS:
      from: DesignRule
      to: DesignRule
      extraction_hint: >
        Two rules that deliberately stand BESIDE each other and must never be
        merged — they cover adjacent ground for different reasons. Not
        DUPLICATES (which invites exactly the merge this forbids), not
        SUPERSEDES (neither replaces the other), not DEPENDS_ON (each stands
        alone without the other).
      # WHY THIS EXISTS. dragon Boss, 2026-08-22, added a governance rule that
      # sits deliberately beside an existing one — one binds what you may CLAIM,
      # the other what must be TRUE whether or not anyone claims anything. That
      # relationship is the single most important thing for a future reader, and
      # the schema had nowhere to put it. What was available: DUPLICATES
      # (actively wrong), SUPERSEDES (wrong), DEPENDS_ON (wrong), or
      # CONTRADICTS with alignment=supporting — documented as corroboration of
      # the SAME assertion, which is not what complementary means. They took the
      # last and wrote a long note begging future readers not to merge the two.
      #
      # ⭐ THE POINT IS THAT IT PREVENTS A DESTRUCTIVE ACT, not that it is more
      # expressive. `possible_duplicate` looks at same-category DesignRules with
      # overlapping vocabulary and is reasonably likely to propose merging two
      # complementary rules. Nothing structural stops it today — only a human
      # reading a paragraph. This is what a detector can read and REFRAIN on.
      #
      # ⚠️ NARROW ON PURPOSE, and narrow is the reversible direction. Requirements
      # and Constraints plausibly want this too, but widening an enumeration later
      # is safe while NARROWING one strands every edge already written under the
      # broader form — the trap VERIFIES's own comment records. Start where the
      # evidence is.
      properties:
        # Why they must not be merged, in a sentence. Required in spirit: an
        # edge asserting "do not merge" with no reason is one a later reader
        # cannot check, and this edge exists precisely to be obeyed by a
        # heuristic that would otherwise act.
        evidence: { type: string }

    CONSTRAINS:
      # SOURCE ENUMERATED, TARGET DELIBERATELY LEFT WILDCARD.
      #
      # Found 2026-08-08 while writing the governance-proposal skill:
      # `describe_schema(from: DesignRule, to: Component)` reported ZERO exact
      # and zero half-exact matches, and its own note said the seventeen
      # candidates "accept the pair only because an endpoint is the `*`
      # wildcard: they will validate, but validating is not the same as meaning
      # what you intended." A rule binding a component is the most ordinary
      # thing governance does, and no edge modelled it.
      #
      # Same defect as the VERIFIES wildcard closed in #112, one edge along.
      #
      # THE SOURCE LIST IS NOT A GUESS: the hint below has always asserted
      # exactly these two, and every CONSTRAINS edge in this design agrees —
      # 3 from Constraint, 3 from DesignRule, nothing else. Semantically nothing
      # else can be a constraint source, so enumerating it forecloses nothing.
      #
      # THE TARGET STAYS `*` ON PURPOSE, and that restraint is the point.
      # Narrowing a wildcard is a CONSUMER-FACING BREAK: another project's graph
      # may legitimately constrain a node type this one happens not to, and this
      # repo is the test rig, not the target
      # (rule:fixes-are-judged-by-the-third-party). "What a rule limits" is
      # genuinely open — capability, requirement, component, interface, flow —
      # so the honest declaration is open too. Enumerating the source alone is
      # already enough for describe_schema to rank the pair as modelled rather
      # than merely tolerated, which was the whole complaint.
      from: [Constraint, DesignRule]
      to: "*"
      extraction_hint: >
        A Constraint or DesignRule binds a target node. Source = the
        Constraint/DesignRule, target = what it limits — a Component, a
        Capability, a Requirement, an Interface: whatever the rule actually
        governs.
      properties:
        note: { type: string }
        # BL-11: this target's share of the source Constraint's budget, in the
        # Constraint's quantity unit. An edge without one is REPORTED by
        # budget_report, never silently treated as zero.
        contribution: { type: float, description: "This target's spend against the budget, in the Constraint's quantity unit." }
        basis: { type: enum, values: [estimated, evidence, measured], default: estimated, description: "How the contribution was set — mirrors the coupling weight_basis rigor." }
        measured_at: { type: string, description: "When the contribution was OBSERVED, for a `basis` that decays. An estimate stays an estimate; a MEASUREMENT is a statement about a system at a moment, and `measured` is the strongest claim this schema offers and the only one that goes stale. Added 2026-08-16 after music_graph F22: a contribution recorded as 6.9 fps with basis=measured, against a 40 fps minimum, while the true measured value was 55.06 — right when taken and wrong for days, with nothing able to say so. Deliberately a free string, matching Artifact.last_confirmed_at and Question.asked_at, because the core takes no clock and a date the caller did not give is a claim nobody made. UNSTATED IS REPORTED, NEVER GUESSED: budget_report counts a `measured` contribution with no date as undated rather than treating it as fresh, which is ver:evidence-quality's TIME axis applied to the one number a KPP verdict rests on." }
