# functional.yaml — P1 Function layer (WHAT).
#
# WHAT the thing does, and HOW its functions interact — independent of WHERE
# they live. Framework- and domain-neutral: always a DAG of Capabilities.

schema:
  name: functional
  version: 1

  node_types:

    Capability:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        description: { type: string, required: true, fulltext: true }
        capability_type: { type: string, indexed: true, description: "validation / transform / query / persistence / decision / actuation / io / compute — free text; domain-neutral." }
        tier: { type: enum, values: [strategic, operational, tactical], indexed: true }
        inputs: { type: string, description: "JSON array of input names/types the capability consumes." }
        outputs: { type: string, description: "JSON array of outputs it produces." }
        is_entry_point: { type: bool, description: "A flow's starting capability." }
        is_exit_point: { type: bool, description: "A flow's terminal capability." }
        status: { type: enum, values: [planned, in_progress, realized, verified], default: planned, indexed: true, description: "How far this capability has got, and NOTHING ELSE. It records what was BUILT, so it only ever moves forward. THERE IS DELIBERATELY NO `cancelled` OR `dropped` VALUE, and the absence is the thing to read: abandonment is NOT a status here, it is recorded by an ACCEPTED Decision drawing OBSOLETES at the capability (dec:idea-discontinued-is-a-first-class-state) — the decision that withdrew it is the honest source, and a discontinuation always has one even when it has no replacement. That computes `discontinued: true`, which get_node returns beside this field and which three gap detectors and delivery arithmetic already read; this field goes on saying `realized` on purpose, because the thing WAS built. Recording abandonment by writing DROPPED into `description` instead is the failure this note exists to prevent — it puts the fact somewhere no detector, report or rollup can compute on. The retire-from-design skill (/retire-from-design) walks it, and asks the question that decides it: was this ever true? A capability nobody ever agreed to is a different case with no decision to hang the edge from — see dec:exploratory-staging." }
        provenance: { type: enum, values: [authored, planned, inferred, healed, reconciled, imported], default: authored, indexed: true, description: "How this node entered the graph. Same vocabulary as Fragment.provenance." }
      embedding_field: description
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 82 }
      extraction_hint: >
        A discrete unit of capability the design must provide — a software
        function, a product feature, a mechanical action, a process step.
        Extract the WHAT, never the WHERE. Link capabilities with DEPENDS_ON to
        form the functional DAG; attach to a Flow with PART_OF_FLOW.

    Flow:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        description: { type: string, fulltext: true }
        flow_type: { type: enum, values: [process, data_flow, control_flow, decision_flow, capture, retrieval, generation], default: process, indexed: true }
        tier: { type: enum, values: [strategic, operational, tactical, cross_cutting], default: operational, indexed: true }
        entry_point: { type: string, description: "Capability name/id where the flow begins." }
        exit_point: { type: string, description: "Capability name/id where the flow ends." }
      embedding_field: description
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 82 }
      extraction_hint: >
        An ordered process that links Capabilities end to end (e.g. "user
        authentication flow", "assembly sequence"). Capabilities join a flow
        via PART_OF_FLOW.

    Actor:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        description: { type: string, fulltext: true }
        actor_type: { type: enum, values: [user, operator, external_system, service, device, stakeholder], default: user, indexed: true }
      embedding_field: description
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 82 }
      extraction_hint: >
        An external party, user, system, or device that interacts with the
        design. Actors sit at the boundary; they INTERACT_WITH Capabilities or
        Flows and often originate Requirements.

  edge_types:

    DEPENDS_ON:
      from: "*"
      to: "*"
      extraction_hint: >
        Source needs target to function. Between Capabilities this forms the
        functional DAG (must stay acyclic); also valid Component→Component.
      properties:
        dependency_type: { type: enum, values: [function_call, data_flow, control_flow, error_flow, physical] }
        optional: { type: bool, default: false }
        # Coupling-weight facet (graph-analysis.md). weight is a STRENGTH
        # (higher = tighter); invert to a cost for shortest-path/closeness.
        weight: { type: float, range: [0.0, 1.0], description: "Coupling strength (higher = tighter)." }
        frequency: { type: float, description: "Interactions per unit time, if known (raw signal behind weight)." }
        data_volume: { type: float, description: "Bytes/records per interaction, if known (raw signal behind weight)." }
        weight_basis: { type: enum, values: [estimated, evidence, measured], default: estimated, description: "How the weight was set: an LLM estimate, grounded in evidence, or measured from telemetry." }

    PART_OF_FLOW:
      from: Capability
      to: Flow
      extraction_hint: A Capability participates in a Flow.
      properties:
        step_order: { type: int, description: "Position of this capability within the flow." }
        weight: { type: float, range: [0.0, 1.0], description: "Coupling strength (higher = tighter)." }
        frequency: { type: float, description: "Interactions per unit time, if known." }
        data_volume: { type: float, description: "Bytes/records per interaction, if known." }
        weight_basis: { type: enum, values: [estimated, evidence, measured], default: estimated, description: "How the weight was set." }

    INTERACTS_WITH:
      from: Actor
      to: "*"
      extraction_hint: An Actor interacts with a Capability, Flow, or Interface.
      properties:
        interaction: { type: string, description: "reads / writes / triggers / receives." }
