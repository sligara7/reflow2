# operate.yaml — P5 Operation layer.
#
# The built thing in the world: packaged versions, the contexts they run in,
# and the real resources they need or consume.

schema:
  name: operate
  version: 1

  node_types:

    Release:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        version: { type: string, indexed: true }
        description: { type: string, fulltext: true }
        unit_type: { type: enum, values: [container, package, binary, bundle, physical_build, publication], default: container, indexed: true }
        status: { type: enum, values: [planned, built, deployed, retired], default: planned, indexed: true }
        created_at: { type: string }
      embedding_field: description
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 85 }
      extraction_hint: >
        A packaged, operable version of some Components/Artifacts — a container
        image, a released package, a manufactured build, a published document.
        DEPLOYED_TO an Environment; REQUIRES_RESOURCE for what it consumes.

    Environment:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        description: { type: string, fulltext: true }
        # `simulation` added 2026-07-27 (req:design-the-simulator). Additive enum
        # growth, the same call as Verification.method's — validation runs on
        # write, the stamp counts node/edge TYPES, so older graphs stay readable.
        # A simulator IS an operating context: the extraction hint below already
        # says swapping the Environment swaps the constraint space, which is
        # exactly the difference between a rig and the real world.
        env_type: { type: enum, values: [development, staging, production, field, lab, physical_site, simulation], default: production, indexed: true, description: "Where this context sits on the reality axis. `simulation` is a modelled stand-in — a rig, a digital twin, a physics model — and reflow2 reads it to say when a capability is proven ONLY in simulation. Deliberately NOT ranked against lab/staging/field: which of those is 'more real' is domain-specific, and asserting an order would be wrong somewhere and worked around rather than corrected (dec:report-dont-judge)." }
        location: { type: string, description: "Cloud region, host, physical site, or jurisdiction." }
      embedding_field: description
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 85 }
      extraction_hint: >
        The operating context a design runs/operates in — a cloud env, a server,
        a lab bench, or a real-world site/jurisdiction (Kennewick WA; Mars
        surface). More than a deploy target: an Environment IMPOSES an
        authoritative rule-set (EnvironmentRule, see environment.yaml) that the
        design must comply with. Swapping the Environment swaps the constraint
        space.

    Resource:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        description: { type: string, fulltext: true }
        resource_type: { type: string, indexed: true, description: "database / queue / secret / gpu / power / material / bandwidth — free text." }
        provider: { type: string, indexed: true, description: "Who supplies it (cloud provider, vendor, utility)." }
        # Added 2026-07-28 by req:design-dependencies-declared. These four apply
        # when `resource_type` is `design-dependency` — another DESIGN this one
        # depends on, at a stated version.
        #
        # Declared here rather than stored undeclared, because a property the
        # schema does not name is one `describe_schema` cannot show and no other
        # tool can discover — the same "the record and the computation disagree"
        # shape that produced three defects this week.
        #
        # And declared on Resource rather than as a new node type ON PURPOSE: the
        # version stamp counts node and edge TYPES, so a new type would lock out
        # every older reflow2 for a feature that does not need it. The fit is
        # imperfect — Resource's own hint says database / queue / GPU / power —
        # and that imperfection is the price of not breaking every existing
        # install. Revisit if dependencies grow their own analysis.
        version: { type: string, indexed: true, description: "For a `design-dependency`: the version this design MEANS to depend on — a tag, a commit, a release. The load-bearing field, because it is what a dependency's published surface can be taken AS OF. A seam analysis without it silently answers about whatever the provider's `main` happens to be." }
        components: { type: string, description: "For a `design-dependency`: comma-separated parts actually taken — crate names, service names, whatever the dependency's unit of consumption is." }
        features: { type: string, description: "For a `design-dependency`: comma-separated build switches this design forwards to the dependency BY NAME. Recorded because they are contract whether or not the provider treats them as one — a renamed feature is a downstream build break that no public-API diff, OpenAPI document or surface export would mention." }
        declared_in: { type: string, description: "For a `design-dependency`: which build file the pin actually lives in (Cargo.toml, docker-compose.yml, versions.env), so the claim can be rechecked at its source rather than trusted. One dependency can be pinned in several files at once." }
      embedding_field: description
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 85 }
      extraction_hint: >
        A real-world resource the built thing needs or consumes — a database, a
        message queue, a secret, a GPU, electrical power, a raw material,
        bandwidth. Linked from Components/Releases via REQUIRES_RESOURCE.

  edge_types:

    DEPLOYED_TO:
      from: Release
      to: Environment
      extraction_hint: A Release runs/operates in an Environment.
      properties:
        status: { type: enum, values: [planned, active, rolled_back] }

    INCLUDES:
      from: Release
      to: [Artifact, Component]
      extraction_hint: >
        What a Release actually ships. The Release node always claimed to be "a
        packaged, operable version of some Components/Artifacts" — this is the
        edge that claim lived without until BL-34, which is why "does what we
        released match what we designed?" was inexpressible rather than merely
        unimplemented. The as-released view is read off these edges; a Release
        with none is a version number, not a manifest.
      properties:
        as_checksum: { type: string, description: "The artifact's content hash as shipped in THIS release — frozen at cut time, so later baseline moves do not rewrite what a past release contained." }

    REQUIRES_RESOURCE:
      from: "*"
      to: Resource
      extraction_hint: A Component or Release needs/consumes a Resource.
      properties:
        criticality: { type: enum, values: [optional, recommended, required] }
