# structure.yaml — P2 Structure layer (WHERE).
#
# WHERE functions live and how the thing is organized: buildable units, the
# contracts between them, the decisions that shaped them, and the baseline
# snapshot taken when design freezes for a build round.

schema:
  name: structure
  version: 1

  node_types:

    Component:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        purpose: { type: string, required: true, fulltext: true }
        kind: { type: enum, values: [service, module, subsystem, assembly, part, section, layer], indexed: true, description: "The organizational/buildable shape. Domain-neutral." }
        level: { type: string, default: component, indexed: true, description: "Axis-Y decomposition level (matryoshka) — a rung on THIS design's ladder, which the design defines via Project.decomposition_levels. Used to detect missing-intermediate / level-mismatch gaps: never link across >1 rung directly. WAS A CLOSED ENUM [component, subsystem, system, system_of_systems, enterprise] until 2026-08-25 (dec:the-decomposition-ladder-is-open-not-a-fixed-enum): `component` was a hard FLOOR, so a part of a component could not be expressed at all, which made req:recursive-black-box-decomposition (\"nested as deep as the design needs\") unsatisfiable rather than merely unfinished. Those five names remain the DEFAULT ladder, so nothing that predates the change moves. It is a plain string rather than an enum because the permitted values are now per-design and the schema cannot know them; a level that is not on the design ladder is REPORTED by hierarchy_issues as `unknown_level` rather than silently accepted or silently defaulted."}
        tier: { type: enum, values: [strategic, operational, tactical], indexed: true }
        location: { type: string, description: "Where it lives — a source dir, a physical location, a document path." }
        status: { type: enum, values: [planned, in_progress, realized, verified], default: planned, indexed: true }
        provenance: { type: enum, values: [authored, planned, inferred, healed, reconciled, imported], default: authored, indexed: true, description: "How this node entered the graph. Same vocabulary as Fragment.provenance." }
      embedding_field: purpose
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 82 }
      extraction_hint: >
        A buildable or organizational unit that hosts Capabilities — a
        microservice, a code module, a mechanical assembly, a document section.
        Capabilities are ALLOCATED_TO Components; Components CONTAINS
        sub-Components.

    Interface:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        description: { type: string, fulltext: true }
        # `unspecified` added and made the default on 2026-07-28
        # (req:seam-incompatibility). `REST` was the default, so EVERY Interface
        # created without a stated medium claimed to be REST — and this project's
        # own three said so while being a Rust library API, a document format and
        # an MCP tool surface. A default that asserts a technology nobody chose is
        # the same defect `designation` already avoids by defaulting to
        # `internal`: publishing is a commitment, and so is naming a protocol.
        #
        # It is not cosmetic. `medium` is a pairing-key axis
        # (req:complementary-pairing), so a library boundary silently reading as
        # REST would pair against a REST provider and the rule would confidently
        # produce a wrong answer. And seam checking treats `unspecified` as
        # "nobody has said" rather than as agreement, which a defaulted `REST` on
        # both sides would have falsely satisfied.
        #
        # `json_rpc` added 2026-08-23 on Anthony's word. The enum named no
        # value for MCP over streamable HTTP, so `ifc:mcp-tools-http` sat at
        # `unspecified` — honestly, but at a cost: `medium` is a pairing-key
        # axis, so that boundary could not pair with ANYTHING, including flo2's
        # `ifc:reflow2-design-api`. `REST` was the wrong escape hatch: this is a
        # SINGLE endpoint carrying JSON-RPC 2.0 where every operation is a named
        # tool, not verbs on a resource tree.
        #
        # Adding it had been declined once on the ground that enum values are
        # invisible to the version stamp. That reasoning is recorded two ways in
        # this project and they disagree: the note below says the stamp's
        # blindness LOCKS NOBODY OUT (a reason it is safe), while the interface
        # node cited the same fact as a reason to decline. Settled by treating
        # them as two questions — the missing WORD is fixed here; the stamp not
        # counting vocabulary is a separate defect with its own history and is
        # not fixed by leaving a boundary unnameable.
        #
        # Enum VALUES are not counted by the version stamp, so this locks nobody
        # out. Note that defaults apply ON CREATE, never retroactively: every
        # Interface written before today keeps whatever it already has, so an
        # existing design may still claim a medium nobody chose. Those have to be
        # corrected by hand — which is what makes this worth reporting rather
        # than silently changing.
        medium: { type: enum, values: [REST, gRPC, json_rpc, event, graphql, cli, library, data, mechanical, electrical, human, unspecified], default: unspecified, indexed: true, description: "How the contract is carried. `unspecified` is the honest default — silence is not a claim that a boundary is REST. Read by seam checking and by boundary pairing, where a wrong value is worse than an absent one: two boundaries can only be wired together if their media match, so an unstated medium must read as UNKNOWN and never as agreement." }
        spec: { type: string, description: "Free-text detail that the structured fields below do not carry — a prose note, a link to an OpenAPI document, a connector drawing. Kept because no field set covers every domain, but it is NOT where the things two systems must agree on belong: those are structured, because prose cannot be compared." }
        # req:interface-spec-complete (Anthony, 2026-07-27). A published contract
        # has to carry what two systems must AGREE on, in terms a computation can
        # compare — otherwise two designs can be linked and reflow2 still cannot
        # say they disagree. Additive properties, so the version stamp (which
        # counts node/edge TYPES) does not move and older graphs stay readable.
        #
        # NOT here on purpose: rate limits, timeouts, max concurrency. Those are
        # numeric limits with a unit and a direction, which is exactly what
        # `Constraint` already carries (quantity/limit/direction) and what
        # `budget_report` already rolls up — and CONSTRAINS is `*`→`*`, so a
        # Constraint can bind an Interface today. Adding parallel properties
        # would be a second place to say the same thing, and the two would drift.
        paradigm: { type: enum, values: [synchronous, asynchronous, streaming, batch, unspecified], default: unspecified, indexed: true, description: "Request-response, event-driven, a continuous stream, or scheduled batches. A hard incompatibility when two sides differ: a consumer written against request-response cannot simply be pointed at an event feed. `unspecified` is the honest default — silence is not a claim that it is synchronous." }
        payload_format: { type: enum, values: [json, xml, protobuf, avro, msgpack, binary, text, csv, form, none, unspecified], default: unspecified, indexed: true, description: "How the payload is serialized on the wire. The other hard incompatibility: one side speaking protobuf where the other expects JSON fails immediately and totally." }
        payload_schema: { type: string, description: "Where the field-level contract lives, or the contract itself — mandatory versus optional fields, types, formatting rules (ISO 8601 dates and the like). A pointer is fine and usually better than an inline copy that will drift from the source." }
        endpoint: { type: string, description: "Where a request goes: a URL or path, a port, a queue or topic name, a memory address, a function symbol. What a consumer needs to actually reach this." }
        operations: { type: string, description: "The actions this contract permits — HTTP verbs, RPC method names, read/write commands. A consumer calling an operation the provider does not offer is a mismatch, which is why this is recorded rather than left implicit in `spec`." }
        auth: { type: enum, values: [none, api_key, oauth2, jwt, mtls, basic, signature, kerberos, physical, unspecified], default: unspecified, indexed: true, description: "How the caller proves who it is. A mismatch here is a mismatch that shows up at the worst time: the consumer that assumed `none` gets 401s in production. `physical` covers the hardware case, where access IS the credential." }
        transport_security: { type: enum, values: [none, tls, mtls, ipsec, vpn, air_gapped, physical, unspecified], default: unspecified, indexed: true, description: "How the data is protected in motion. Distinct from `auth`: one is who you are, the other is who can read it. A provider offering `none` against a consumer requiring `tls` is a refusal to connect, not a degradation." }
        error_model: { type: string, description: "How failures are signalled and structured — the status vocabulary (HTTP codes, custom bitmasks, error enums) and the shape of a failure response, so a consumer can parse the reason automatically rather than string-matching prose." }
        designation: { type: enum, values: [internal, published, required, both], default: internal, indexed: true, description: "This boundary's ROLE, which is what makes composition computable rather than hand-wired (req:complementary-pairing, dec:pairing-role-placement). `published` = this design OFFERS the contract and others are entitled to rely on it — MOSA's modular/major system interface (10 U.S.C. 4401), what an ICD publishes, and the surface a composed design links through instead of reaching into another system's internals (req:key-interfaces, req:design-composes). `required` = this design NEEDS one of these FROM OUTSIDE; it is the half that was missing until 2026-07-30, and without it a design could say what it offered but not what it needed in any form another design could be matched against. `both` = it offers and needs one, which stays rare and therefore stays meaningful. `internal` = plumbing the owner may change freely. THE ROLE IS ON THE INTERFACE, NOT THE NODE: a Component both publishes and subscribes, so a per-node role collapses to `both` and pairs with everything — that collapse was the tell that the attribute was on the wrong noun. Pairing is COMPLEMENTARY, never like-with-like: `published`/`both` matches `required`/`both`, the way a base pairs with its complement and not with a copy of itself. Default `internal` on purpose: publishing is a commitment, and defaulting to it would assert one nobody made — the same reasoning that makes a new Decision `proposed`. But BECAUSE it is the default, `internal` cannot distinguish 'deliberately internal' from 'nobody classified this', so pair_designs counts and names every internal boundary rather than letting an unlabelled design report a clean seam. Read by impact analysis (which published boundaries a change crosses, so severability is computed rather than asserted — req:modularity-computed) and by pairing. NOT a claim the boundary has held: whether it stayed stable is its drift history, which is evidence, not a property anyone sets." }
        provenance: { type: enum, values: [authored, planned, inferred, healed, reconciled, imported], default: authored, indexed: true, description: "How this node entered the graph. Same vocabulary as Fragment.provenance." }
      embedding_field: description
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 82 }
      extraction_hint: >
        A contract or connection point between Components (or between a
        Component and an Actor). One Component PROVIDES it; others CONSUME it.
        Folds in what a software design would call an API endpoint.

    Decision:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        decision: { type: string, required: true, fulltext: true, description: "What was decided." }
        rationale: { type: string, fulltext: true }
        alternatives: { type: string, description: "JSON array of options considered and why they lost." }
        # BL: `proposed` is the default on purpose (2026-07-25, req:decision-status-not-asserted).
        # It used to be `accepted`, so recording an open question asserted that it
        # had been settled and reasoned — the same forgery dec:certainty-derived
        # forbids for requirement status, with more consequence, because an accepted
        # Decision is what where-am-i reads back as "what you decided", what the
        # fork layer treats as binding, and what the KPP contradiction check reads
        # as a trade already made. Reaching `accepted` is now a separate act
        # (`set_decision_status`, or `collapse_decision` choosing a fork).
        status: { type: enum, values: [proposed, accepted, superseded, rejected], default: proposed, indexed: true }
        # The structural home for "somebody looked and there was nothing to draw"
        # (2026-08-21, dec:idea-what-notices-an-idea-that-connects-to-nothing).
        #
        # Without it, an idea nobody has opened and an idea somebody judged and
        # found genuinely new are INDISTINGUISHABLE — both carry no relation —
        # and any detector over the first would keep reporting the second. The
        # brainstorm skill asks for the judgement in prose; prose cannot be told
        # apart from silence, so the judgement gets a place of its own. Written
        # by `review_relations`, which is also the door the edges go through, so
        # the two possible outcomes of one act are recorded the same way.
        #
        # Deliberately a NOTE and not a boolean: what was searched and what was
        # nearest is the part a later reader can overturn. A bare `true` would
        # say the review happened and nothing about whether it was any good.
        # WHAT THE DESIGN IS FOR, on the quality axis — decided 2026-08-25
        # (dec:the-ility-target-is-a-governing-decision-asked-at-genesis).
        #
        # THE DISTINCTION THAT EARNS IT A PROPERTY: DimensionAssessment records
        # a SCORE on an axis — what the system IS. This records what it is FOR.
        # Nothing held the second, and giving DimensionAssessment a second
        # meaning is the overload that made `Interface.designation` ambiguous.
        # Measured the day this was added: 0 DimensionAssessment and 0
        # DimensionObservation nodes exist, so the axis vocabulary was fully
        # defined and had never once been used.
        #
        # ⚠️ NO DEFAULT, AND THAT IS THE WHOLE POINT. Absence must read as
        # "nobody was asked", because a detector over the absence is the only
        # thing that notices genesis skipping the question. A default would also
        # be materialised onto every existing Decision when an export is read
        # back — the failure `Capability.delivery` records, where a design whose
        # export does not restore to itself is a backup that would not restore.
        # Additive and unbackfilled on purpose: old graphs simply carry none.
        #
        # Same nine values as DimensionAssessment deliberately, so a later
        # ility_report can compare what was TARGETED against what it COMPUTES,
        # rather than two vocabularies that never meet.
        quality_target: { type: enum, values: [reliability, performance, maintainability, security, scalability, observability, testability, coupling, maturity], indexed: true, description: "Set when this Decision states the quality attribute the design is BUILT FOR — the answer to \"what is this system for?\". It is a TARGET, not a score: DimensionAssessment records what the system IS on an axis, this records what it is aiming at. It matters because the attribute decides WHICH GRAPH an allocation is computed on and the four disagree — performance wants least chatter across boundaries, reliability wants no articulation point and may deliberately DUPLICATE a function, maintainability wants what-changes-together-to-live-together, security wants boundaries following trust rather than coupling. Allocating without this answer silently picks performance (dec:idea-the-ility-chooses-the-allocation-graph, whose co-change experiment measured 71% of reflow2's own strongest maintainability signal crossing its functional boundaries). ABSENT MEANS NOBODY WAS ASKED, never `none` — there is no default, so `quality_target_unstated` can tell an unanswered design from an answered one. Asked at GENESIS rather than at allocation: asking is cheap and shapes everything downstream, allocating is expensive and still waits for the last responsible moment (dec:idea-allocation-waits-for-the-last-responsible-moment), and the two are different questions." }
        no_relation_note: { type: string, fulltext: true, description: "Set when the relations of this node were reviewed and none was honest — what was searched, what was nearest, why nothing was drawn. Its PRESENCE is what separates a considered idea from an unopened one." }
      embedding_field: decision
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 80 }
      extraction_hint: >
        A design decision with its rationale and the alternatives weighed (an
        ADR, in software terms). Other nodes are GOVERNED_BY a Decision.

    Anchor:
      properties:
        name: { type: string, required: true, indexed: true }
        design_intent: { type: string, fulltext: true, description: "Summary of the frozen design intent." }
        key_decisions: { type: string, description: "JSON array of decision ids/summaries in the snapshot." }
        checksum: { type: string, description: "Hash over the anchored spec set, for drift detection." }
        created_at: { type: string }
      extraction_hint: >
        A checksummed baseline of the design taken when leaving P2 for a build
        round (P3). Not extracted from prose — created by the workflow at the
        structure→build transition. DriftEvents reference the Anchor they
        diverged from.

  edge_types:

    ALLOCATED_TO:
      from: Capability
      to: Component
      extraction_hint: A Capability is assigned to the Component that will provide it. The WHAT→WHERE binding.
      properties:
        note: { type: string }
        # Coupling-weight facet (graph-analysis.md) — see functional.yaml DEPENDS_ON.
        weight: { type: float, range: [0.0, 1.0], description: "Coupling strength (higher = tighter)." }
        frequency: { type: float, description: "Interactions per unit time, if known." }
        data_volume: { type: float, description: "Bytes/records per interaction, if known." }
        weight_basis: { type: enum, values: [estimated, evidence, measured], default: estimated, description: "How the weight was set." }

    PROVIDES:
      from: Component
      to: Interface
      extraction_hint: A Component exposes/provides an Interface.
      properties:
        weight: { type: float, range: [0.0, 1.0], description: "Coupling strength (higher = tighter)." }
        frequency: { type: float, description: "Interactions per unit time, if known." }
        data_volume: { type: float, description: "Bytes/records per interaction, if known." }
        weight_basis: { type: enum, values: [estimated, evidence, measured], default: estimated, description: "How the weight was set." }

    CONSUMES:
      from: "*"
      to: Interface
      extraction_hint: A Component or Actor depends on/consumes an Interface.
      properties:
        weight: { type: float, range: [0.0, 1.0], description: "Coupling strength (higher = tighter)." }
        frequency: { type: float, description: "Interactions per unit time, if known." }
        data_volume: { type: float, description: "Bytes/records per interaction, if known." }
        weight_basis: { type: enum, values: [estimated, evidence, measured], default: estimated, description: "How the weight was set." }

    GOVERNED_BY:
      from: "*"
      to: "*"
      # BOTH ENDS STAY WILDCARD, and the hint is what was wrong.
      #
      # Considered for enumeration 2026-08-08 alongside CONSTRAINS and REFUSED
      # on the consumer argument. This edge carries 829 of the design's links
      # from ten different source types; narrowing either end would refuse pairs
      # another project may legitimately use and that this one merely happens
      # not to. A wildcard that is genuinely open should say so.
      #
      # What WAS wrong is the sentence below: it named Decision and DesignRule
      # while four live edges already pointed at a Requirement. Exactly the
      # VERIFIES failure — a hint that had stopped describing and started
      # guessing — and the cheap half of the fix.
      extraction_hint: >
        Source node is shaped or constrained by a target Decision, DesignRule
        or Requirement. Anything in the design may be governed, which is why
        the source stays open.
      properties:
        note: { type: string }
        # Added 2026-08-17 for req:a-deliberate-state-is-not-a-defect.
        #
        # ⭐ WHY THE EDGE AND NOT THE NODE OR THE DECISION (Anthony's call).
        # On the NODE it would need declaring on every type that can be parked
        # and a bare flag would be an unevidenced claim. On the DECISION it
        # would park everything that ruling governs — blunt, and a later
        # GOVERNED_BY would silently inherit the parking. On the EDGE it is
        # per-node and precise: one ruling parks the thirty-one documents it
        # actually covers and nothing else, and it is TWO-SIDED BY
        # CONSTRUCTION — you cannot claim a deliberate state without a real
        # Decision to hang it on, because the claim IS the edge to the ruling.
        #
        # THE FAILURE IT ANSWERS, measured by dev_storyflow's fleet: defects
        # moved 88 -> 97 across ten artifact writes, EIGHT OF THEM DELIBERATE
        # no-claim registrations prescribed by a standing ruling, with 31 more
        # documents owed in the same genre. The direction is the bad one — THE
        # CORRECT ACTION DEGRADED THE INSTRUMENT — and it is self-reinforcing,
        # because a later seat watching the count climb has an incentive to stop
        # registering documents at all, which is the worse state.
        #
        # ⚠️ AND SILENCE WAS ALREADY AVAILABLE, WHICH IS WHY THIS IS NOT ABOUT
        # SUPPRESSION. Reproduced live before this was designed: an Artifact
        # carrying ANY GOVERNED_BY edge already escapes orphan_node, because the
        # detector sees an edge rather than a ruling. So the deliberate ones
        # could be hidden and could not be COUNTED — "deliberately parked" and
        # "never looked at" gave the identical answer, a vacuous zero in
        # different clothes. `ruling: parks` is what lets a report say
        # "34 defects, 8 parked" instead of "97" or of nothing at all.
        #
        # UNSET IS THE ORDINARY CASE and means plain governance: this shapes
        # that. No default asserts parking, per req:defaults-do-not-assert.
        ruling: { type: enum, values: [parks], indexed: true, description: "What KIND of governance this edge records. Unset — the ordinary case — means the target simply shapes the source. `parks` means the ruling declares the source's UNATTACHED or UNSATISFIED state to be CORRECT AND DELIBERATE, so a structural detector reports it as parked rather than as a defect, and COUNTS it separately rather than going quiet. Two-sided by construction: the claim is the edge to the ruling, so a deliberate state can never be asserted without a Decision that says why. NOT A JUDGEMENT AND NOT A SILENCER (dec:report-dont-judge): reflow2 reads a ruling the design already made and reports the node accordingly; the parked nodes stay visible and counted, because a marker that made them disappear would be the silent truncation this increment exists to end." }
