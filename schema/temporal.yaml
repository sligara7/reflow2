# temporal.yaml — Axis Z: how the design changes over time.
#
# Adapted from storyflow's temporal.yaml (NarrativeEpoch / TemporalFact /
# snapshots). A design is never static — requirements creep, features get added,
# failed tests force fixes, scope shifts. This domain lets the graph REMEMBER the
# past instead of overwriting it, and attribute every change to its cause.

schema:
  name: temporal
  version: 1

  node_types:

    DesignEpoch:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        epoch_type: { type: enum, values: [baseline, revision, milestone, incident_response, release_cut], default: revision, indexed: true }
        sequence: { type: int, indexed: true, description: "Monotonic ordering key across epochs." }
        status: { type: enum, values: [planned, arrived], default: arrived, indexed: true, description: "Whether this epoch HAS HAPPENED (`arrived`) or is a claim about one that has not (`planned`) — the forward half of the time axis (req:epochs-can-be-planned). DELIBERATELY SEPARATE FROM `epoch_type`, which says what KIND of epoch it is: kind and tense are orthogonal, and folding `planned` into the type enum would make a planned milestone unsayable. Mirrors `Release.status`, which already carries `planned` for the capability view — one word for one idea. THE DEFAULT IS `arrived` AND THAT IS A RECORD, NOT A CHOICE (req:defaults-do-not-assert): `add_epoch` has only ever created points that already exist, so every epoch written before this property did arrive, and the default states what the operation has always meant rather than inventing a claim. Planning is the deliberate act, exactly as publishing is for Interface.designation. READ, not merely stored: `record_change` REFUSES to record history into a `planned` epoch, because a snapshot of the present cannot belong to a point that has not happened." }
        description: { type: string, fulltext: true }
        checksum: { type: string, description: "Optional hash over the anchored spec set at this epoch (an Anchor is a checksummed baseline epoch)." }
        created_at: { type: string }
      embedding_field: description
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 85 }
      extraction_hint: >
        A named version or milestone of the design — "v1 baseline",
        "v1.1 requirements creep", "post-load-test hardening". The unit the Z
        (time) axis is built on. Usually authored at a phase/version transition,
        not extracted from prose. Generalizes the P2→P3 Anchor.

    TemporalFact:
      properties:
        subject_id: { type: string, required: true, indexed: true, description: "Node the fact is about." }
        fact_type: { type: string, indexed: true, description: "status / allocation / dependency / satisfaction / property — what kind of assertion." }
        statement: { type: string, fulltext: true, description: "The time-bounded assertion in plain terms." }
        value: { type: string, description: "JSON of the asserted value (e.g. {status: realized})." }
        # Added 2026-08-02 for BL-68 (dec:readiness-forecast-is-a-temporal-fact).
        # ADDITIVE: every fact written before this defaults to `measured`, which
        # is what they all were — the property states what the record has always
        # meant rather than inventing a claim about it (req:defaults-do-not-assert,
        # the same argument DesignEpoch.status made for `arrived`).
        basis: { type: enum, values: [measured, forecast], default: measured, indexed: true, description: "Whether this assertion RECORDS something that happened or PROJECTS something expected to. The distinction is the whole value of a derived roadmap: a reader must be able to tell which epochs rest on evidence and which on projection, and a chart that cannot is worse than no chart. `forecast` is why this property exists — a readiness projection ('TRL 7 valid from 2035') is a TemporalFact and NOT a DimensionObservation, because `observed_at` says OBSERVED and nobody observed anything in 2035. Recording a projection as an observation is [BL-157]'s fiction sitting inside the machinery the roadmap is computed FROM, where it would propagate rather than sit still." }
        confidence: { type: float, range: [0.0, 1.0], description: "How much weight the author puts behind this assertion — most meaningful on a `forecast`, where `req:plans-move-honestly` already commits to confidence that decays with horizon, and a ten-year TRL projection needs it more than any plan does. STATED BY THE AUTHOR, NEVER COMPUTED BY REFLOW2 (Anthony, 2026-08-02): a decay curve is a judgement about risk appetite, and deriving one from distance-in-epochs would assert a risk model nobody chose — the same defect as defaulting the gating threshold, one layer along. Absent means unstated, which reads as unstated and never as certain." }
        # Added 2026-08-16 for `dec:how-should-a-temporal-fact-carry-its-date-when-there-is-no-epoch`.
        # NOT A SECOND WAY TO SAY THE SAME THING — a second thing to say. The
        # EDGES `VALID_FROM` / `VALID_TO` point at a DesignEpoch and answer "from
        # which named milestone"; these answer "from which DATE". A roadmap wants
        # the first, an audit trail the second, and only the edge can be ordered
        # against other epochs by `sequence`.
        valid_from: { type: string, indexed: true, description: "The DATE this assertion became true, when there is no epoch to point at. NOT a replacement for the `VALID_FROM` edge, which names a DesignEpoch and is what a roadmap orders by `sequence`; this is for the far commoner case where a writer has a calendar date and no milestone. DECLARED BECAUSE THE CORPUS ALREADY SAID IT: on 2026-08-16, 112 of 205 TemporalFacts carried exactly this property undeclared, 76 carried the edge, and ZERO carried both — a clean split, which is what a MISSING WORD looks like rather than what carelessness looks like (`fact:defect-half-the-temporal-facts-date-themselves-where-nothing-reads`). Minting one DesignEpoch per calendar date was the alternative and was rejected: it floods the time axis with points that mark nothing, damaging the roadmap computation that is the epoch's whole purpose. READ, not merely stored — `search_design` returns `as_of` and `age_days` for any fact carrying it, which is part 3 of `cap:claims-carry-their-age`: a six-week-old observation must not be narrated as current." }
        valid_to: { type: string, indexed: true, description: "The DATE this assertion stopped being true; absent means still true. The date-shaped counterpart of the `VALID_TO` edge, exactly as `valid_from` is to `VALID_FROM`, and carried for the same reason: a writer who knows when a claim expired rarely has a milestone named for that moment. `search_design` reports a fact whose `valid_to` has passed as `expired`, so a superseded observation stops reading as current — the failure `req:a-dated-observation-does-not-read-as-standing-doctrine` names." }
      embedding_field: statement
      extraction_hint: >
        A time-bounded assertion, true only over a stretch of time. Requirement
        creep = a satisfaction fact that becomes true LATER; a dropped
        requirement = a fact whose validity ENDS. The graph keeps both instead of
        overwriting — so any past state is reconstructable.
        TWO WAYS TO SAY WHEN, and they are not interchangeable: the `VALID_FROM`
        / `VALID_TO` EDGES point at a DesignEpoch, which is what a roadmap orders
        by `sequence`; the `valid_from` / `valid_to` PROPERTIES carry a plain
        DATE, for the commoner case where there is no milestone to point at.
        Prefer the edge when a real epoch exists; otherwise write the date.
        (This hint previously described VALID_FROM and VALID_TO as though they
        were fields — which is what taught 112 writers to invent them.)

    Snapshot:
      properties:
        target_id: { type: string, required: true, indexed: true, description: "Node this snapshot captures." }
        target_type: { type: string, indexed: true, description: "Label of the captured node (Component, Capability, Requirement...)." }
        state: { type: string, description: "JSON of the node's property bag at the epoch." }
        edges: { type: string, description: "JSON array of the node's design edges at the epoch (direction, edge_type, other endpoint, edge properties), sorted for byte-stable exports. Bookkeeping neighbours (history, provenance, observations, questions) are excluded: an edge move is a design change and must be recoverable (BL-63), the audit trail is not. Absent on snapshots taken before BL-63." }
        captured_at: { type: string }
      extraction_hint: >
        The state of a node captured at a specific DesignEpoch — how a Component
        or Requirement WAS, then. Enables diffing an entity across revisions.
        Authored by the versioning workflow, not extracted from prose.

    ChangeEvent:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        change_type: { type: enum, values: [requirement_creep, new_feature, test_failure_fix, defect_fix, performance_optimization, refactor, scope_change, constraint_change, environment_change, deprecation, resync, baseline_established], required: true, indexed: true, description: "Why the change happened. defect_fix is 'the design was right and the code was wrong' — added 2026-08-15 after five sessions across three projects each picked a DIFFERENT least-wrong value for it. baseline_established is reserved for set_artifact_checksum (BL-157): an Artifact getting its FIRST checksum is a change to the RECORD and nothing else, so forcing it through refactor/test_failure_fix writes a fiction into the ledger that exists to prevent fiction." }
        subject: { type: enum, values: [system, record], indexed: true, description: "WHICH AXIS this event is on: did the SYSTEM change, or did only the design's KNOWLEDGE of it change? Unstated means nobody said, and is never read as either. Added 2026-08-15 because change_type was carrying both questions at once — baseline_established's own definition names this split ('every other variant answers why the thing changed; this one says the thing did not change and only the design's knowledge of it did') and then left that axis with one reserved member nobody could use. Five forced choices followed, by four people, across two independent tool surfaces." }
        summary: { type: string, fulltext: true }
        rationale: { type: string, description: "Why the change was made." }
        detected_at: { type: string }
      embedding_field: summary
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 82 }
      extraction_hint: >
        A first-class record of WHY the design changed — requirement creep, a new
        feature, a fix forced by a failed test, a refactor, a scope change. Wired
        to what it changed via CHANGED, and to its cause via the inference edges
        (a failing Verification CAUSES a ChangeEvent that CHANGED an Artifact).
        This is the design-evolution log; distinct from DriftEvent, which records
        design-vs-reality divergence rather than intended change.

  edge_types:

    PRECEDES:
      from: DesignEpoch
      to: DesignEpoch
      extraction_hint: One epoch comes before another (ordering).

    CONTAINS_EPOCH:
      from: DesignEpoch
      to: DesignEpoch
      extraction_hint: One epoch nests inside a larger one (a hotfix epoch within a release epoch).

    HAS_TEMPORAL_FACT:
      from: "*"
      to: TemporalFact
      extraction_hint: An entity carries a time-bounded fact.

    ABOUT_ENTITY:
      from: TemporalFact
      to: "*"
      extraction_hint: The entity a temporal fact concerns.

    VALID_FROM:
      from: TemporalFact
      to: DesignEpoch
      extraction_hint: The fact becomes true at this epoch.

    VALID_TO:
      from: TemporalFact
      to: DesignEpoch
      extraction_hint: The fact stops being true at this epoch (absent = still true).

    HAS_SNAPSHOT:
      from: "*"
      to: Snapshot
      extraction_hint: An entity has a captured state snapshot.

    AT_EPOCH:
      from: "*"
      to: DesignEpoch
      extraction_hint: A Snapshot or ChangeEvent is pinned to the epoch it belongs to.

    SCHEDULED_FOR:
      from: [Requirement, Capability, Question]
      to: [DesignEpoch, Release]
      extraction_hint: >
        The satisfaction schedule — this requirement or capability is DUE at
        that epoch or release. Deliberately NOT AT_EPOCH, which means "belongs
        to" and is declared over a wildcard source: one edge type carrying both
        belongs-to and due-at would make them indistinguishable to every
        detector (dec:schedule-is-an-edge-with-modality). Points at either of
        the two paired views — a DesignEpoch for the time axis, a Release for
        the capability-increment axis.
      properties:
        modality: { type: enum, values: [expected, required], default: expected, indexed: true, description: "WHICH KIND OF CLAIM this is. `expected` is a plan — the schedule's ordinary case. `required` is an obligation: missing it at arrival is a computed violation rather than a slip, and it is the scheduling face of a KPP, giving content inviolability (req:inviolable-intent) a deadline dimension. THERE IS DELIBERATELY NO `achieved` VALUE, and its absence is load-bearing: delivery is COMPUTED from the golden thread and never asserted (req:completion-computed, dec:arrival-delta), so storing it here would create a second source of truth that can disagree with the first — a plan recording its own success is the plan lying about itself." }
        recorded_at: { type: string, description: "When this scheduling claim was made. The plan's movement is read from snapshots of the epoch rather than from this field (dec:arrival-delta); this only dates the claim itself." }

    CHANGED:
      from: ChangeEvent
      to: "*"
      extraction_hint: The node a ChangeEvent created, modified, or removed.
      properties:
        action: { type: enum, values: [added, modified, removed] }
        field: { type: string, description: "Which property/edge changed, when scoped." }
        accepted_baseline: { type: bool, default: false, description: "True when this edge records a drift-baseline accept (BL-33): the event carries the disposition claim the confirmation ledger reads. Ordinary change history stays false." }

    OCCURS_DURING:
      from: "*"
      to: DesignEpoch
      extraction_hint: A Fragment/ChangeEvent/Verification happened during an epoch.
