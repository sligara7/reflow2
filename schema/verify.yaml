# verify.yaml — P4 Verification layer.
#
# How we know the built thing meets its intent, the gates it must clear, and
# the record of where reality diverged from design.

schema:
  name: verify
  version: 1

  node_types:

    Verification:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        description: { type: string, fulltext: true }
        # Additive enum growth, the same call as drift_type below and
        # PROVEN rather than assumed on 2026-07-26: a binary built with the
        # previous value set reads a graph containing `demonstration` and
        # reports it faithfully. Validation runs on write, and the version
        # stamp counts node/edge TYPES (unchanged at 28/55), so an older
        # reflow2 stays able to read; it simply cannot write the new values.
        method: { type: enum, values: [test, review, simulation, inspection, measurement, analysis, demonstration, observation], default: test, indexed: true, description: "HOW the check was made. Test, analysis, inspection and demonstration are the four canonical verification methods in DoD/INCOSE practice; `demonstration` (showing the feature working on a live example) was missing until 2026-07-26 and had to be miscoded as `test`, which is how a great deal of acceptance actually gets closed. `observation` is the as-fielded method — watching a system run without changing it — distinct from `inspection` (examining the artifact for flaws) and from `demonstration` (running a contrived example). `review` and `simulation` are kept as the document and modelled sub-cases people already use. A distinct axis from `kind`: these say how you looked, `kind` says whether you were checking the spec or the intent." }
        kind: { type: enum, values: [verification, validation], default: verification, indexed: true, description: "Verification = built right (meets the spec); validation = right thing (meets the operational intent/need). A distinct axis from method/level. Was the VALIDATES edge (retired, dec:edge-orthogonality); read by the unvalidated_capability gap." }
        level: { type: enum, values: [unit, integration, system, acceptance], default: unit, indexed: true }
        location: { type: string, description: "Path to the test/inspection artifact." }
        # `superseded` added 2026-08-23: a check REPLACED by a broader one is not
        # `skipped` (which means a run was deliberately not made) and must not go
        # on reporting `passing`. Read by `loop_status.verifications.by_status`
        # and by graph_report, so a retired check stops counting as live coverage.
        status: { type: enum, values: [planned, passing, failing, skipped, blocked, superseded], default: planned, indexed: true }
        last_run_at: { type: string }
        # Added 2026-08-17 for req:a-finding-has-somewhere-to-put-its-evidence.
        #
        # ⭐ THE THIRD THING. `name` is what a list renders, `description` is what
        # the check IS, and this is what the check FOUND. The corpus had two of
        # the three and authors put all three in `name`.
        #
        # MEASURED ON REFLOW2'S OWN GRAPH BEFORE ADDING IT, because the
        # requirement itself asked whether a new field would change anything:
        # 164 Verifications, MEDIAN `name` 76 WORDS, 72 over 100, 17 over 300,
        # longest 654. A `name` is what a list renders; these are reports.
        #
        # ⚠️ AND THE ANSWER TO "WOULD A FIELD ALONE CHANGE ANYTHING?" WAS NO,
        # WHICH IS WHY THIS ARRIVES WITH A CONSTRUCTOR CHANGE BESIDE IT.
        # `description` above has been declared, fulltext and the embedding
        # field since the beginning — and is used ONCE IN 164 NODES. Not
        # ignored: UNREACHABLE. `add_verification(id, name, method, level)` had
        # no parameter for it, so the only route was raw `create_node`, and
        # essentially nobody took it. Everyone wrote into `name` because `name`
        # was the only string the constructor accepted. Adding `findings`
        # without making both writable would have produced a SECOND field
        # nobody writes to — the exact trap
        # dec:how-should-a-temporal-fact-carry-its-date-when-there-is-no-epoch
        # documented, where 112 nodes wrote an UNDECLARED property because the
        # declared route did not fit.
        #
        # WHERE IT IS WRITTEN IS THE DESIGN, not a convenience: `description`
        # goes on the CONSTRUCTOR (what the check is, stated once) and
        # `findings` on `set_verification_status` (what a RUN found, restated
        # every time an outcome changes). Evidence belongs to a run, so it is
        # recorded at the moment the run produces it.
        #
        # It also gives mutation evidence a home — "mutation-checked three ways,
        # discarding the guard fails exactly two" is a FINDING, and reflow2 has
        # been writing that into names too.
        findings: { type: string, fulltext: true, description: "What this check FOUND when it last ran — the evidence, as distinct from `description`'s account of what the check IS and `name`'s label. Written by set_verification_status, because a finding belongs to a RUN rather than to the definition. Keep `name` short enough for a list: before this field existed the median Verification name on reflow2's own graph was 76 words and the longest 654, because there was nowhere else to put a report. NOT VALIDATED AND NOT PARSED — reflow2 records what the author says a run found and never judges it (dec:non-goal-reflow2-does-not-judge-whether-a-check-is-meaningful); a status of `passing` beside findings that describe a failure is a contradiction only a reader can catch." }
      embedding_field: description
      resolution: { strategy: fuzzy_then_vector, fuzzy_threshold: 85 }
      extraction_hint: >
        A check that a Capability or Artifact is sound — a test, an analysis, an
        inspection, a demonstration (the four canonical methods), a measurement,
        an observation of the fielded system, a review, a simulation. It VERIFIES
        its target; `kind` says whether it checks the spec (verification) or the
        intent (validation); folds in both individual cases and suites (`level`).

    QualityGate:
      properties:
        name: { type: string, required: true, indexed: true, fulltext: true }
        phase: { type: enum, values: [P0, P1, P2, P3, P4, P5, PM], indexed: true }
        criteria: { type: string, fulltext: true, description: "JSON array of pass/fail conditions." }
        status: { type: enum, values: [pending, passed, failed, waived], default: pending, indexed: true }
        evaluated_at: { type: string }
      embedding_field: criteria
      extraction_hint: >
        A phase gate with explicit pass/fail criteria that must clear before
        advancing (e.g. "DAG is acyclic", "all Requirements have coverage").
        Usually authored by the workflow, not extracted from prose.

    DriftEvent:
      properties:
        name: { type: string, required: true, indexed: true }
        summary: { type: string, fulltext: true }
        severity: { type: enum, values: [low, medium, high, critical], default: medium, indexed: true }
        # The deployment_* values are the P5 kinds (BL-9): the as-fielded
        # divergence between what DEPLOYED_TO declares and what is observed
        # actually running. Additive enum growth — validation runs on write,
        # so older graphs stay readable and the stamp is unchanged.
        drift_type: { type: enum, values: [missing_artifact, spec_mismatch, undocumented_addition, status_mismatch, checksum_change, deployment_missing, deployment_undeclared, deployment_contradicted], indexed: true }
        detected_at: { type: string }
        resolved: { type: bool, default: false, indexed: true }
      embedding_field: summary
      extraction_hint: >
        A recorded divergence between the design (graph/Anchor) and reality
        (filesystem/build). Produced by drift detection, not extracted from
        prose. References the Anchor it diverged from via DEPENDS_ON.

  edge_types:

    PERFORMED_IN:
      from: Verification
      to: Environment
      extraction_hint: >
        WHERE a check was actually carried out. Without this a check run on a
        simulation rig and the same check run in the field are indistinguishable,
        so a capability proven only against a model reads exactly like one proven
        against reality — which is the risk req:design-the-simulator exists to
        make visible. Absent means unstated, never assumed real.

    VERIFIES:
      from: Verification
      # ENUMERATED RATHER THAN `*`, and the DesignRule entry is the point.
      #
      # The wildcard ACCEPTED a DesignRule target — nothing was broken — but it
      # did not MODEL one, so `describe_schema` ranked it as merely tolerated and
      # no detector treated a rule as a verifiable thing. The cost was not a
      # wrong edge; it was an unaskable question: "which of my rules have no
      # detector?" reflow2's own answer was FOUR OUT OF FOUR — five DesignRules,
      # four carrying `enforced: true` (which this schema defines as
      # gate-blocking), and not one of the five with an incoming VERIFIES.
      #
      # Proposed by dev_storyflow's api-boss 2026-08-08 from Anthony's own
      # governance-as-design framing, after they found five rules-without-checks
      # in a single session — a routing rule naming a file that names no worker
      # entry point, a comms rule whose quoted example is a forgeable handshake,
      # a claim protocol with no detector for its own bypass. Their words: "no
      # report could have listed them, because the graph cannot currently be
      # asked."
      #
      # THE LIST MUST KEEP ALL SIX. The first four were DERIVED from live edges,
      # not copied from the report that proposed this: narrowing to fewer would
      # invalidate edges that exist today. Re-derive before ever trimming it.
      #
      # ⚠️ AND THE GUARD ABOVE WAS NOT ENOUGH, WHICH IS WHY Constraint IS HERE.
      # It protects against TRIMMING the list and says nothing about the
      # enumeration being INCOMPLETE WHEN FIRST DERIVED. The 2026-08-08 census
      # found five types at 95/27/13/2/1 edges and missed two carrying ONE edge
      # each — a long tail invisible to a count. The moment `to` stopped being
      # `*`, every unlisted-but-existing edge became unimportable, and
      # dev_storyflow's committed export — the design that PROPOSED this change —
      # could not be re-imported by the binary that wrote it for at least four
      # days, across thirty export commits, while loop_status, sync_status and
      # the content_hash chain all read green. A SCHEMA TIGHTENING THAT SILENTLY
      # ORPHANS EXISTING DATA IS A BREAKING CHANGE WEARING A VALIDATION ERROR'S
      # CLOTHES.
      #
      # ⭐ NOTE THE SHAPE, because this edge has now made the same mistake twice
      # at two levels: the extraction_hint below records that it once named only
      # three types while four were true. The hint under-enumerated, was caught,
      # was fixed, and the lesson was written down — and then the LIST did it.
      #
      # Constraint added on Anthony's word, 2026-08-15
      # (dec:should-a-verification-be-able-to-verify-a-constraint). A Constraint
      # is a limit the design must respect, and asking whether a limit HOLDS is
      # the most natural thing anyone would want to check about it — it is what
      # budget_report already answers arithmetically for the numeric case.
      # DesignRule was already here, and a Constraint is its sibling: the imposed
      # limit beside the chosen rule. Nothing ever explained why they were split.
      #
      # 📌 Project remains UNLISTED and is deliberately a separate question. It
      # is the other type the census missed, and a Verification that verifies a
      # whole Project reads as a modelling slip rather than a need — but it has
      # not been ruled on, and dev_storyflow's export still carries one, so that
      # export still will not import until somebody decides.
      #
      # ⭐ Interface added 2026-08-22, Anthony's call, and it is the THIRD time
      # this list has been found short — the two above are recorded as the
      # extraction hint under-enumerating, then the census missing a long tail.
      # This one could not appear in either, because no edge existed to count:
      # AN ABSENCE CANNOT SHOW UP IN A SURVEY OF WHAT IS PRESENT.
      #
      # THE COST OF IT BEING ABSENT, measured on reflow2's own design: ALL 18
      # Interfaces carry ZERO incoming VERIFIES — not a low number, the total
      # absence a banned edge produces — which reads as "nobody wrote one" when
      # the truth was "nobody could". Three of those are PUBLISHED contracts.
      # `ifc:mcp-tools` is specified 9 of 9 axes, is the surface every user's
      # agent binds to, and could not carry a single piece of evidence that it
      # still offers what it says.
      #
      # AND THE CHECK ALREADY EXISTED. `tools/toolsnap.py` freezes every served
      # tool schema as a committed golden and fails CI when the live binary
      # disagrees — conformance of an implementation against a published
      # contract, which is exactly what a check on an Interface asserts. It had
      # to hang off a Capability instead, so "which of my contracts have no
      # check?" was unaskable. That is the same argument DesignRule was admitted
      # on, one node type over.
      #
      # WHAT A CHECK ON A CONTRACT MEANS, stated so it is not confused with a
      # unit test: it asserts the boundary STILL OFFERS WHAT IT SAYS — the
      # operations, the payload shape, the error model. A Capability's check
      # asks whether the behaviour works; a contract's asks whether the promise
      # is still kept. Different evidence, different failure, both worth having.
      #
      # WIDENING IS THE SAFE DIRECTION, which the two incidents above were not.
      # This list going NARROWER orphaned real data and made a committed export
      # unimportable for four days; going wider refuses less than before and can
      # orphan nothing. The stamp carries node and edge TYPE NAMES, not target
      # lists, so this owes no upgrade note.
      to:
        [Capability, Requirement, Artifact, Component, DesignRule, Constraint, Interface]
      extraction_hint: >
        A Verification checks a Capability, Artifact, Component, Requirement,
        DesignRule, Constraint, or Interface. Requirement was already true and unlisted here
        — three such edges existed while this hint named only three types, which
        is how a hint stops being a description and becomes a guess. Constraint
        was added later for the same reason one level down: it was true in a real
        design before the list admitted it.
      properties:
        coverage: { type: enum, values: [full, partial, smoke] }
        # BL-126, dec:evidence-scope-on-the-verifies-edge. WHAT PART of the
        # input space the check actually covered, recorded on the EDGE and not
        # on the Verification: scope is a fact about the claim, so one suite can
        # cover capability A across the whole space and touch capability B at a
        # single point. A per-node property would have to average that away.
        #
        # These are deliberately not the `coverage` enum above. That is a
        # self-assessed adjective set by whoever wrote the check, and BL-126's
        # founding case was a guard written by an author to protect a belief
        # formed an hour earlier — they would have said `full`. A named
        # parameter is checkable against what the design claims the capability
        # is independent of; an adjective is not.
        #
        # Comma-separated because the schema has no list type (the
        # QualityGate.criteria precedent). The MCP surface takes and returns
        # proper lists; only the storage is flat, so parameter names must not
        # themselves contain commas.
        pinned: { type: string, description: "Comma-separated parameter names this check HELD FIXED — the seeds, orderings, locales and hostnames every check pins by the same instinct that made them nuisance parameters, which is why defects live there. Unset means the scope was never stated, which is reported as unscoped and never read as full coverage." }
        swept: { type: string, description: "Comma-separated parameter names this check VARIED. A parameter swept by any passing check is no longer reported as pinned-everywhere for that claim, because something did move it." }

    # BL-136, dec:calibration-is-an-edge. What a value was FITTED to, so that
    # the same evidence cannot silently count as its validation.
    #
    # Structural on purpose, and this is the whole point: the project that hit
    # this built four independent internal diagnostics — a back-solve, a
    # coefficient locus, a space-time frontier and a physical-floor proof — and
    # every one narrowed the question correctly while none could have found the
    # defect. Only the outside source could. No check internal to a design can
    # establish its own independence, so reflow2 records the relation rather
    # than trying to detect circularity analytically.
    IMPLEMENTS:
      from: Artifact
      to: Verification
      extraction_hint: >
        This file IS the executable form of that check — the script, test or
        harness a Verification is actually run BY. Not REALIZES (that says a
        file implements a CAPABILITY; a check interrogates one rather than
        providing it), not DOCUMENTS (this is executable, not prose), and not
        CALIBRATED_AGAINST (nothing here was fitted to the check's output).
      # WHY THIS EXISTS, and it was filed by somebody who did the right thing.
      #
      # dragon Boss, 2026-08-19, had written a Verification and then written the
      # script that re-runs the repeatable half of it. `describe_schema
      # {from: Artifact, to: Verification}` answered honestly — no edge type
      # names both sides — and listed three that name one side exactly plus
      # sixteen reachable only through a double wildcard. THEY FOLLOWED THE
      # GUIDANCE AND LEFT THE EDGE OUT rather than assert one that is wrong.
      # The check stayed an orphan Artifact, and the question the design most
      # wants to ask later — "which of our checks are wired to something
      # runnable?" — was the one thing no edge could express.
      #
      # ⭐ WHAT IT BUYS, which is the `dec:edge-orthogonality` test this had to
      # pass: `loop_status.verifications.never_run` is ONE number today covering
      # two very different debts — a check nobody has run, and a check with no
      # executable form at all. With this edge those separate.
      #
      # ⚠️ ENUMERATED, NOT `*`, for the reason spelled out on VERIFIES above: a
      # wildcard would ACCEPT this pair and never MODEL it, so describe_schema
      # would go on ranking it merely tolerated. And the honest wildcard answer
      # is what stopped the reporter asserting a wrong edge in the first place —
      # that distinction is worth keeping, so this is a modelled fit rather than
      # a widened loophole.
      properties:
        # How much of the check this file actually runs. A Verification often has
        # a repeatable half and a judgement half; saying which is which stops a
        # green script being read as the whole check having passed.
        covers: { type: enum, values: [whole, partial], default: whole }
        note: { type: string }

    CALIBRATED_AGAINST:
      from: "*"
      to: [Artifact, Verification]
      extraction_hint: >
        The evidence a value in the design was DERIVED from — a published
        anchor, a dataset, a measurement, or the check whose output it was fitted
        to. Agreement with that evidence afterwards is a fit, not a test. A
        traceability edge (dec:calibration-propagates): when the anchor is
        corrected or superseded, every value fitted to it is in the blast radius.
      properties:
        note: { type: string, description: "What was fitted, and how — the part a later reader needs to judge whether the fit still stands." }
        calibrated_at: { type: string, description: "When the fit was made, if recorded. The core takes no clock and never asks the system the time." }
